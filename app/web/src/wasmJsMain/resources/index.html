<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Every screen of the app has an address of its own (…/app/song/…), and this page is only ever loaded as
         the folder it lives in: a deeper address is not a file, so the host's 404 page sends it here with the path in
         the query string (…/app/?/song/…, see 404.html in the site's repository), and the development server
         redirects the same way. This runs before anything on the page is fetched, and does two things with it:

         - It writes that folder into a <base>, which is what every relative address on the page and in the app is
           resolved against from then on - the icon and the fonts below, campfire.js, the binaries, the resources
           Compose fetches as it needs them and the storage worker the first write starts - so they keep working
           once the app has put a deeper address into the address bar.
         - It puts the address the query string carries back into the address bar, where the app reads it as the
           screen to open on. The history entry's state is kept, although a page loaded again starts at the bottom
           of its own history either way.

         A query string that does not start with a slash is not touched: that is an authorization answer, which the
         app takes out itself once it has read it. -->
    <script type="application/javascript">
        (function (l) {
            var folder = l.pathname.replace(/[^\/]*$/, '');
            var base = document.createElement('base');
            base.href = folder;
            document.head.appendChild(base);
            if (l.search[1] === '/') {
                var decoded = l.search.slice(2).split('&').map(function (s) {
                    return s.replace(/~and~/g, '&');
                }).join('?');
                window.history.replaceState(window.history.state, '', folder + decoded + l.hash);
            }
        }(window.location));
    </script>
    <!-- The decisions behind keeping the app in the browser (see the end of the page), apart from everything that
         acts on them so that app/web/tests/launch.test.cjs can run them as they are. Plain functions of what the build
         says, what the cache holds and what the deployment answered. -->
    <script id="campfire-launch" type="application/javascript">
        window.campfireLaunch = (function () {
            'use strict';

            /** The address a file of a build is asked for and kept under: its path, versioned by its own content. */
            function addressOf(path, entry, folder) {
                var url = new URL(path, folder);
                url.searchParams.set('v', entry.sha256.substring(0, 16));
                return url.href;
            }

            /** The files of [files], a build's map, that are not among [kept], the addresses the cache holds. */
            function missingFiles(files, kept, folder) {
                var held = {};
                kept.forEach(function (address) {
                    held[address] = true;
                });
                return Object.keys(files).sort().map(function (path) {
                    return { path: path, entry: files[path], address: addressOf(path, files[path], folder) };
                }).filter(function (file) {
                    return !held[file.address];
                });
            }

            /** What the cache holds that the build of [files] does not name, the kept page aside. */
            function staleAddresses(files, kept, folder) {
                var named = {};
                Object.keys(files).forEach(function (path) {
                    named[addressOf(path, files[path], folder)] = true;
                });
                return kept.filter(function (address) {
                    return address !== folder && !named[address];
                });
            }

            /** Whether [text], a kept page, is the page of build [id]: the build writes its id into the page. */
            function isPageOf(text, id) {
                return typeof text === 'string' && text.indexOf('{"id":' + JSON.stringify(id) + ',') !== -1;
            }

            /** The answer build.json gave, or null for one that is not a build's. */
            function parseAnswer(value) {
                return value && typeof value.id === 'string' && typeof value.page === 'string'
                && value.files && typeof value.files === 'object' ? value : null;
            }

            /**
             * Whether to start the page's own build ("keep") or download the one the deployment named and start that
             * ("update"). A build the page already reloaded for once in this tab is not tried again: a deployment
             * whose files keep failing their check would otherwise reload the page for ever.
             */
            function nextStep(ownId, answer, reloadedFor) {
                return answer && answer.id !== ownId && answer.id !== reloadedFor ? 'update' : 'keep';
            }

            return {
                addressOf: addressOf,
                missingFiles: missingFiles,
                staleAddresses: staleAddresses,
                isPageOf: isPageOf,
                parseAnswer: parseAnswer,
                nextStep: nextStep
            };
        })();
    </script>
    <!-- The fallback for a browser without the VirtualKeyboard API, which the app uses to lay the keyboard over the
         page and keep clear of it as an inset (ProvideKeyboardInsets): with resizes-content Firefox makes the page
         itself shorter while the keyboard is up, and the canvas is laid out above it the way Android's adjustResize
         does it; by default only the visual viewport shrinks, leaving the bottom of the app under the keyboard and the
         whole canvas panned up to keep the focused field in view. Safari ignores the key. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <!-- The two schemes of the app's own color: the dark background, and the light surfaceContainerHigh, since Chrome
         ignores a theme-color as light as the light background. Once the preferences are read the app writes the
         palette it is drawn in over both (see BrowserThemeColorEffect in CampfireWebApp.kt). -->
    <meta name="theme-color" content="#E9E7F0" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#15121C" media="(prefers-color-scheme: dark)">
    <meta name="description" content="Song lyrics and chords, in a library of plain ChordPro files that stays yours.">
    <title>Campfire</title>
    <link rel="icon" type="image/png" sizes="192x192">
    <!-- Every file of a distribution is asked for with its own version in the query string, this page aside, which
         is the one address that has to stay put. The host lets a browser keep any file for ten minutes by its address
         and a deployment replaces the files one address at a time, so without it a page could start with a campfire.js
         whose binaries were already deleted, or a binary with the resources of another release. With it every release
         is a set of addresses of its own, which only the page that belongs to it knows, while a file a release left as
         it was keeps its address and stays cached. The versions are written by the build together with the rest of
         the manifest (see build.gradle.kts): a hash of each file's content, so a build of the same sources asks for the
         same addresses. A file the manifest does not name is asked for as it is. They are also the addresses the files
         are kept in the browser under (see the end of the page), so a request the app makes offline finds its file.

         Everything the app fetches goes through fetch(), which is wrapped here for good, before campfire.js is loaded;
         campfire.js itself and the storage worker are asked for by name through campfireVersioned. Only addresses inside
         this page's folder are touched, so a request to the sync service is not. On the development server there is no
         manifest and nothing is changed.

         The fonts the interface (see InterfaceTypography.wasmJs.kt) and the tabs (see MonospaceFontFamily.wasmJs.kt) are
         set in are preloaded from here as well, since the address a preload answers has to be the versioned one: they
         are fetched alongside the binaries rather than after them, so they are in by the time the app asks for them.
         "fetch" and "crossorigin" are what make the Compose resource reader's own fetch() the request this answers;
         as="font" would be downloaded twice. -->
    <script type="application/javascript">
        (function () {
            var build = /*{{BUILD}}*/null;
            var folder = new URL('.', document.baseURI).href;

            // An address that already names a version is left as it is: that is a file of another build, which the
            // page downloads to keep before it starts that build.
            function versioned(url) {
                var resolved = new URL(url, document.baseURI);
                if (!build || resolved.href.indexOf(folder) !== 0 || resolved.searchParams.has('v')) {
                    return url;
                }
                var path = decodeURIComponent(resolved.pathname.substring(new URL(folder).pathname.length));
                var entry = build.files[path];
                return entry ? window.campfireLaunch.addressOf(path, entry, folder) : url;
            }

            window.campfireBuild = build;
            window.campfireVersioned = versioned;
            if (build) {
                var nativeFetch = window.fetch;
                window.fetch = function (input, init) {
                    var isAddress = typeof input === 'string' || input instanceof URL;
                    return nativeFetch.call(window, isAddress ? versioned(String(input)) : input, init);
                };
            }
            [
                'inter_regular',
                'inter_medium',
                'inter_bold',
                'jetbrains_mono_regular',
                'jetbrains_mono_bold'
            ].forEach(function (font) {
                var link = document.createElement('link');
                link.rel = 'preload';
                link.as = 'fetch';
                link.crossOrigin = 'anonymous';
                link.href = versioned('composeResources/com.pandulapeter.campfire.presentation.resources/font/' + font + '.ttf');
                document.head.appendChild(link);
            });
        })();
    </script>
    <!-- The icon of the theme color the user chose, which the app leaves in local storage whenever it shows one (see
         FaviconEffect in CampfireWebApp.kt), so that the tab and the loading screen are in that color before the app
         that knows it has been downloaded. Only a name the app writes is taken: this is a URL on the page. Asked for by
         its versioned address like every other file, which is the address it is kept under for an offline start. -->
    <script type="application/javascript">
        (function () {
            var icon = 'favicon-campfire.png';
            try {
                var chosen = window.localStorage.getItem('campfire-icon');
                if (/^favicon-[a-z]+\.png$/.test(chosen || '')) {
                    icon = chosen;
                }
            } catch (e) {
            }
            icon = window.campfireVersioned(icon);
            document.querySelector('link[rel="icon"]').setAttribute('href', icon);
            document.documentElement.style.setProperty('--splash-icon', 'url("' + icon + '")');
        })();
    </script>
    <style>
        /* The palette is CampfireColorScheme's, so the splash screen and the first
           composed frame paint the same background and the handover is invisible. */
        :root {
            color-scheme: light dark;
            --background: #FAF8FE;
            --on-background: #1D1A23;
            --track: #E5DFF5;
            --indicator: #5A49CA;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --background: #15121C;
                --on-background: #E3E1EA;
                --track: #494456;
                --indicator: #D0BCFF;
            }
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--background);
        }

        /* The Compose canvas replaces the contents of this element, so it must be a container of its
           own rather than <body>: the splash screen is a sibling that outlives the handover. */
        #app {
            width: 100%;
            height: 100%;
        }

        /* Compose gives its canvas "pan-x pan-y", so that a page it is nested in can still be scrolled, and hands a
           touch gesture to the browser whenever it reported a scroll by the first touchmove but moved nothing with it.
           A drag that sets off while a scroll is still settling reports an empty one as the finger lands, and the
           browser then cancels the whole gesture for a page that cannot scroll at all, so the drag is lost: the first
           touch at the top of a song. This page is the app and nothing else, so every gesture is the app's.
           Important, since Compose writes its value into the canvas' own style. */
        #app canvas {
            touch-action: none !important;
        }

        #splash {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            background-color: var(--background);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            transition: opacity 300ms ease-out;
        }

        #splash.is-done {
            opacity: 0;
            pointer-events: none;
        }

        #splash-icon {
            width: 96px;
            height: 96px;
            background-image: var(--splash-icon, url("favicon-campfire.png"));
            background-size: contain;
            background-repeat: no-repeat;
        }

        #splash-name {
            color: var(--on-background);
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.4px;
        }

        #splash-track {
            width: 200px;
            max-width: 60vw;
            height: 4px;
            border-radius: 2px;
            background-color: var(--track);
            overflow: hidden;
        }

        #splash-bar {
            width: 100%;
            height: 100%;
            border-radius: 2px;
            background-color: var(--indicator);
            transform: scaleX(0);
            transform-origin: left center;
        }

        #splash-message {
            max-width: 280px;
            margin: 0 24px;
            color: var(--on-background);
            font-size: 14px;
            line-height: 20px;
            text-align: center;
        }

        #splash-retry {
            padding: 10px 24px;
            border: none;
            border-radius: 20px;
            background-color: var(--indicator);
            color: var(--background);
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        @media (prefers-reduced-motion: reduce) {
            #splash {
                transition: none;
            }
        }
    </style>
</head>
<body>
<div id="app"></div>
<div id="splash">
    <div id="splash-icon"></div>
    <div id="splash-name">Campfire</div>
    <div id="splash-track" role="progressbar" aria-label="Campfire" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="splash-bar"></div>
    </div>
    <!-- Only shown when the app could not be started. In the browser's language where that is one the app speaks:
         the app's own choice is in storage this page does not read, and follows the browser unless it was changed. -->
    <p id="splash-message" role="alert" hidden></p>
    <button id="splash-retry" type="button" hidden></button>
</div>
<script type="application/javascript">
    (function () {
        'use strict';

        // Written by the build (see build.gradle.kts and the head of this page): every file of the build with its
        // size and digest, and how many .wasm binaries there are and what they weigh together, uncompressed. Where
        // the build is kept in the browser, the bar measures the download of whatever it is missing; where it cannot
        // be, it measures the binaries as the app fetches them - the only part of a cold start worth measuring,
        // about 96% of it, and the only part that arrives through fetch(), which is what can be watched from here.
        //
        // It stays null on the development server, where there is no distribution to describe, nothing is kept and
        // the bar falls back to the sizes the server advertises.
        var BUILD = window.campfireBuild;

        var splash = document.getElementById('splash');
        var track = document.getElementById('splash-track');
        var bar = document.getElementById('splash-bar');
        var message = document.getElementById('splash-message');
        var retry = document.getElementById('splash-retry');
        var TEXTS = {
            en: {
                loadFailed: 'Campfire could not be loaded. Check the connection and try again.',
                loadFailedFirstVisit: 'Campfire could not be loaded. It needs a connection the first time it is opened in this browser, so check the connection and try again.',
                unsupported: 'This browser cannot run Campfire. It needs Chrome or Edge 119, Firefox 120, Safari 18.2 (iOS 18.2), or a later version.',
                alreadyOpen: 'Campfire is already open in another tab. Close that tab first, or carry on there.',
                retry: 'Try again'
            },
            hu: {
                loadFailed: 'A Campfire betöltése nem sikerült. Ellenőrizd a kapcsolatot, és próbáld újra.',
                loadFailedFirstVisit: 'A Campfire betöltése nem sikerült. Az első megnyitáshoz ebben a böngészőben internetkapcsolat kell, ezért ellenőrizd a kapcsolatot, és próbáld újra.',
                unsupported: 'Ez a böngésző nem tudja futtatni a Campfire-t. Chrome vagy Edge 119, Firefox 120, Safari 18.2 (iOS 18.2) vagy ezeknél újabb verzió kell hozzá.',
                alreadyOpen: 'A Campfire már meg van nyitva egy másik lapon. Előbb zárd be azt a lapot, vagy folytasd ott.',
                retry: 'Újra'
            }
        };
        var text = /^hu\b/i.test(navigator.language || '') ? TEXTS.hu : TEXTS.en;
        if (text === TEXTS.hu) {
            document.documentElement.lang = 'hu';
        }
        retry.textContent = text.retry;

        var expected = BUILD ? BUILD.binaryBytes : 0;
        var binaries = BUILD ? BUILD.binaryCount : 0;
        var received = 0;
        var completed = 0;
        var pending = 0;
        var startedAt = 0;
        var isReady = false;
        var isFailed = false;
        var shown = 0;
        // Whether the app is started from the build kept in the browser, which is downloaded before anything starts,
        // rather than straight from the network as the app asks for its files.
        var isKeeping = false;
        // Whether that build is complete, as far as this launch found: the one value the Storage row in Settings
        // reports on, handed to Kotlin as window.campfireSavedForOffline.
        var isSaved = false;

        // Downloading is the part whose length is known; compiling and instantiating the module is
        // not. So the download owns the first 92% of the bar and the rest is a decay that approaches
        // but never reaches the end, until the first composed frame reports back.
        var DOWNLOAD_SHARE = 0.92;

        function isStarting() {
            if (isKeeping) {
                return hasStarted;
            }
            return binaries > 0 ? completed >= binaries : (completed > 0 && pending === 0);
        }

        function target() {
            if (isReady) {
                return 1;
            }
            if (isStarting()) {
                if (!startedAt) {
                    startedAt = Date.now();
                }
                return DOWNLOAD_SHARE + 0.07 * (1 - Math.exp((startedAt - Date.now()) / 2500));
            }
            return expected > 0 ? Math.min(1, received / expected) * DOWNLOAD_SHARE : 0;
        }

        var isDrawScheduled = false;
        var postDownloadTimer = null;
        var lastTransform = null;
        var lastPercent = -1;

        function draw() {
            isDrawScheduled = false;
            if (isFailed) {
                return;
            }
            // Eased rather than snapped to the target: the byte counts arrive in bursts of whatever
            // size the network hands over, and following those exactly makes the bar stutter. Never
            // backwards either - a target that drops (a download that turned out to be longer than
            // the server said) is a correction the bar waits out rather than shows.
            var destination = target();
            shown = Math.max(shown, shown + (destination - shown) * 0.15);
            var transform = 'scaleX(' + shown.toFixed(4) + ')';
            if (transform !== lastTransform) {
                bar.style.transform = transform;
                lastTransform = transform;
            }
            // Nothing on the screen says how far along it is, so the bar has to say it out loud.
            var percent = Math.round(shown * 100);
            if (percent !== lastPercent) {
                track.setAttribute('aria-valuenow', String(percent));
                lastPercent = percent;
            }
            if (isReady && shown > 0.999) {
                splash.classList.add('is-done');
                setTimeout(function () {
                    if (splash.parentNode) {
                        splash.parentNode.removeChild(splash);
                    }
                }, 300);
                return;
            }
            if (isReady || !isStarting() && destination - shown > 0.00005) {
                schedule();
            } else if (isStarting() && !isReady && postDownloadTimer === null) {
                // The post-download target changes with time; 30 updates per second are enough for the decay.
                postDownloadTimer = setTimeout(function () {
                    postDownloadTimer = null;
                    schedule();
                }, 34);
            }
        }

        function schedule() {
            if (!isDrawScheduled && !isFailed) {
                isDrawScheduled = true;
                requestAnimationFrame(draw);
            }
        }

        /**
         * Stops the bar where it is and says so. A download that failed, or a script that threw before
         * the app was up, would otherwise leave a bar that never moves again and nothing to do about it.
         */
        function showFailure() {
            if (isReady || isFailed) {
                return;
            }
            isFailed = true;
            message.textContent = isKeeping && !isSaved ? text.loadFailedFirstVisit : text.loadFailed;
            message.hidden = false;
            retry.onclick = function () {
                location.reload();
            };
            retry.hidden = false;
        }

        /**
         * Whether the browser can compile what Kotlin/Wasm produces. Each probe is the smallest module that uses the
         * feature, and validating one compiles and downloads nothing, so this costs well under a millisecond.
         *
         * Garbage collected types: "\0asm", version 1, then a type section (id 1, 5 bytes) declaring 1 type - a
         * struct (0x5f = 95) with 1 field, an i8 (0x78 = 120) that is immutable (0).
         *
         * Exception handling, in the original try / catch form the binary uses: a type section with the function
         * type () -> () (0x60 = 96), a function section with one function of that type, and a code section (id 10)
         * whose one body is: no locals, try (0x06) with no result (0x40 = 64), catch_all (0x19 = 25), end, end (11).
         */
        function isBrowserSupported() {
            try {
                return typeof WebAssembly === 'object'
                    && WebAssembly.validate(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 95, 1, 120, 0]))
                    && WebAssembly.validate(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 4, 1, 96, 0, 0, 3, 2, 1, 0,
                        10, 8, 1, 6, 0, 6, 64, 25, 11, 11]));
            } catch (error) {
                return false;
            }
        }

        /** No retry button: trying again is what cannot help here, and it costs the whole download each time. */
        function showUnsupported() {
            isFailed = true;
            track.hidden = true;
            message.textContent = text.unsupported;
            message.hidden = false;
        }

        function onError() {
            showFailure();
        }

        window.addEventListener('error', onError);
        window.addEventListener('unhandledrejection', onError);
        // The versioning fetch() of the head of the page, which this one is put over and which stays.
        var versionedFetch = window.fetch;
        window.fetch = function (input, init) {
            var url = typeof input === 'string' ? input : (input && input.url) || '';
            var response = versionedFetch.apply(this, arguments);
            if (isKeeping || !/\.wasm([?#]|$)/.test(url)) {
                return response;
            }
            pending++;
            return response.then(function (result) {
                if (!result.ok || !result.body) {
                    pending--;
                    completed++;
                    schedule();
                    return result;
                }
                if (!BUILD) {
                    // No manifest: the server's own answer is the only estimate there is. It is the
                    // size on the wire, so it is short of the truth whenever the server compresses -
                    // hence the clamp in target().
                    expected += parseInt(result.headers.get('content-length'), 10) || 0;
                }
                // Counted on a copy: the response itself goes to instantiateStreaming as the network handed it
                // over, with its URL and its place in the HTTP cache, which is what lets the browser keep the
                // compiled code for next time.
                var reader = result.clone().body.getReader();
                (function pump() {
                    reader.read().then(function (chunk) {
                        if (chunk.done) {
                            pending--;
                            completed++;
                        } else {
                            received += chunk.value.byteLength;
                            pump();
                        }
                        schedule();
                    }, function () {
                        pending--;
                        schedule();
                    });
                })();
                return result;
            }, function (error) {
                pending--;
                showFailure();
                throw error;
            });
        };

        /**
         * Called from Kotlin once the first frames are on the canvas. Everything below the splash
         * screen is already painted by then, so the fade reveals the app rather than an empty page.
         */
        window.campfireReady = function () {
            window.fetch = versionedFetch;
            // The app's own errors are the app's business from here on, not the loading screen's. An error
            // that was taken for a failed start is taken back too, since the app did start after all.
            window.removeEventListener('error', onError);
            window.removeEventListener('unhandledrejection', onError);
            isReady = true;
            isFailed = false;
            schedule();
            forgetOtherBuilds();
        };

        // One library, one page: the app reads its files once and writes them whole from what it remembers, so a
        // second tab would take back what the first one saved. The Web Lock is asked for before anything of the
        // app is downloaded, which is why campfire.js is added from here rather than by a tag of its own - a tab
        // that is turned away has fetched this page and its icon, and nothing else.
        var LOCK_NAME = 'campfire-library';
        var hasStarted = false;

        function startApp() {
            if (hasStarted) {
                return;
            }
            hasStarted = true;
            window.campfireSavedForOffline = isSaved;
            message.hidden = true;
            retry.hidden = true;
            track.hidden = false;
            var script = document.createElement('script');
            script.src = window.campfireVersioned('campfire.js');
            // A script that fails to download reports it to its own tag only, never to the window.
            script.onerror = showFailure;
            document.body.appendChild(script);
            schedule();
        }

        function showAlreadyOpen() {
            track.hidden = true;
            message.textContent = text.alreadyOpen;
            message.hidden = false;
            // Asks again in place rather than reloading: a tab that came back from a consent page still has the
            // answer in its address bar, and the app has to be the one that takes it out.
            retry.onclick = function () {
                claimLibrary(launch, showAlreadyOpen);
            };
            retry.hidden = false;
        }

        // The app keeps a copy of itself in the browser, so that this address opens without a connection: a service
        // worker answers the page's folder from one cache (see service-worker.js for its layout, which is a contract
        // with every page ever kept), and this page decides what goes into it. Every launch, wherever the page came
        // from, first asks the deployment which build is current (build.json, past every cache, for three seconds):
        //
        // - The page's own build: whatever the cache is missing of it is downloaded - all of it on a first visit -
        //   and the app starts.
        // - Another build: that build's missing files are downloaded, then its page, which is stored last, and the
        //   page is loaded again, which the worker answers with the new page. Every page only ever starts the build
        //   it was made with, so no protocol between builds is needed.
        // - No answer, or an update that failed anywhere: the page's own build starts from what is kept.
        //
        // The page being stored last is the whole of the commit: a kept build is the kept page and every file its map
        // names, and an update cut short leaves the previous page with all of its files, and some of the next build's
        // beside them for the next attempt to reuse. Every file is read in full and checked against its digest before
        // it is kept, so an error page or a file of another release, caught mid-deployment, is never kept as part of
        // a build. Only one tab ever writes the cache, since the library's lock is held before this runs. Nothing is
        // kept on the development server, or where the browser has no Cache Storage or refuses it (Firefox's private
        // windows): there the app starts from the network as it always has.
        var CACHE_NAME = 'campfire-web-app';
        var RELOADED_FOR = 'campfire-reloaded-for';
        var ANSWER_TIMEOUT = 3000;
        // A download gives up when nothing has arrived for this long rather than after a total time, which a slow
        // connection could never meet for sixteen megabytes.
        var STALL_TIMEOUT = 15000;
        var CONCURRENT_DOWNLOADS = 4;
        var folder = new URL('.', document.baseURI).href;
        var cache = null;

        function launch() {
            if (hasStarted) {
                return;
            }
            if (!BUILD || !window.caches || !window.crypto || !window.crypto.subtle) {
                startApp();
                return;
            }
            registerWorker();
            Promise.all([
                window.caches.open(CACHE_NAME).catch(function () {
                    return null;
                }),
                askDeployment()
            ]).then(function (results) {
                cache = results[0];
                if (!cache) {
                    startApp();
                    return undefined;
                }
                isKeeping = true;
                expected = 0;
                var answer = results[1];
                if (window.campfireLaunch.nextStep(BUILD.id, answer, readReloadedFor()) === 'update') {
                    return update(answer).catch(function () {
                        return keep(null);
                    });
                }
                return keep(answer && answer.id === BUILD.id ? answer : null);
            }).catch(function () {
                isSaved = false;
            }).then(startApp);
        }

        /**
         * Registered on every launch, which is also what has the browser look for a new version of the worker. Its
         * address never changes, and the browser is told to check it past the HTTP cache.
         */
        function registerWorker() {
            if (navigator.serviceWorker) {
                navigator.serviceWorker.register(new URL('service-worker.js', folder).href, {
                    scope: folder,
                    updateViaCache: 'none'
                }).catch(function () {
                });
            }
        }

        /**
         * build.json, past the HTTP cache and the host's with an address of its own, or null. navigator.onLine is not
         * asked: it says yes on a network that leads nowhere, which is what the time limit is for.
         */
        function askDeployment() {
            var controller = new AbortController();
            var timer = setTimeout(function () {
                controller.abort();
            }, ANSWER_TIMEOUT);
            var address = new URL('build.json', folder);
            address.searchParams.set('launch', Date.now().toString(36) + Math.random().toString(36).slice(2));
            return versionedFetch(address.href, { cache: 'no-store', signal: controller.signal }).then(function (response) {
                return response.ok ? response.json() : null;
            }).then(function (value) {
                clearTimeout(timer);
                return window.campfireLaunch.parseAnswer(value);
            }, function () {
                clearTimeout(timer);
                return null;
            });
        }

        /**
         * Tops up the page's own build and finds out whether it is complete. Missing files are asked for even without
         * an answer from the deployment, since a slow first visit is still online; the page itself can only be kept
         * with one, which is what its digest comes from. A file that cannot be had is not a failure here: the app
         * still starts, asks the network for it, and fails the ordinary way if that cannot answer either.
         */
        function keep(answer) {
            return cachedAddresses().then(function (kept) {
                return download(window.campfireLaunch.missingFiles(BUILD.files, kept, folder));
            }).catch(function () {
            }).then(function () {
                return isPageKept().then(function (isKept) {
                    return isKept || !answer ? undefined : keepPage(answer.page).catch(function () {
                    });
                });
            }).then(function () {
                return Promise.all([isWorkerActive(), isPageKept(), cachedAddresses()]);
            }).then(function (checks) {
                isSaved = checks[0] && checks[1] && window.campfireLaunch.missingFiles(BUILD.files, checks[2], folder).length === 0;
            });
        }

        /**
         * Downloads the build the deployment named and its page, then loads the page again, at the same address -
         * an authorization answer in the query string included, which the new build reads once as this one would
         * have. The reload is noted for this tab, so a page that comes back as this one is not sent round again.
         */
        function update(answer) {
            return cachedAddresses().then(function (kept) {
                return download(window.campfireLaunch.missingFiles(answer.files, kept, folder));
            }).then(function () {
                return keepPage(answer.page);
            }).then(function () {
                try {
                    window.sessionStorage.setItem(RELOADED_FOR, answer.id);
                } catch (e) {
                }
                location.reload();
                // The page is on its way out; nothing of this one starts.
                return new Promise(function () {});
            });
        }

        function readReloadedFor() {
            try {
                return window.sessionStorage.getItem(RELOADED_FOR);
            } catch (e) {
                return null;
            }
        }

        function cachedAddresses() {
            return cache.keys().then(function (requests) {
                return requests.map(function (request) {
                    return request.url;
                });
            });
        }

        function isPageKept() {
            return cache.match(folder).then(function (response) {
                return response ? response.text() : null;
            }).then(function (page) {
                return window.campfireLaunch.isPageOf(page, BUILD.id);
            }, function () {
                return false;
            });
        }

        /** The worker's being there is what answers an offline navigation; a page it does not answer is not kept. */
        function isWorkerActive() {
            if (!navigator.serviceWorker) {
                return Promise.resolve(false);
            }
            return navigator.serviceWorker.getRegistration(folder).then(function (registration) {
                return !!(registration && registration.active);
            }, function () {
                return false;
            });
        }

        /**
         * The page of a build, asked for as index.html, which the worker has no entry for and so sends to the network,
         * and kept under the folder's address, which is what the worker answers a navigation with.
         */
        function keepPage(digest) {
            return fetchChecked(new URL('index.html', folder).href, digest, 'text/html; charset=utf-8').then(function (response) {
                return cache.put(folder, response);
            });
        }

        /**
         * Downloads and keeps [files], a few at a time, counting their bytes for the bar. The first file that fails
         * stops the rest, since the build they belong to cannot be started either way.
         */
        function download(files) {
            files.forEach(function (file) {
                expected += file.entry.size;
            });
            schedule();
            var next = 0;
            var controllers = [];
            var isStopped = false;

            function worker() {
                if (isStopped || next >= files.length) {
                    return Promise.resolve();
                }
                var file = files[next++];
                var controller = new AbortController();
                controllers.push(controller);
                return fetchChecked(file.address, file.entry.sha256, null, controller).then(function (response) {
                    return cache.put(file.address, response);
                }).then(worker);
            }

            var workers = [];
            for (var i = 0; i < Math.min(CONCURRENT_DOWNLOADS, files.length); i++) {
                workers.push(worker());
            }
            return Promise.all(workers).catch(function (error) {
                isStopped = true;
                controllers.forEach(function (controller) {
                    controller.abort();
                });
                throw error;
            });
        }

        /**
         * A file read in full and checked against its digest, as a response that carries its content type and
         * nothing else. The binaries are always application/wasm, which is what lets them compile as they stream
         * out of the cache, whatever the host said.
         */
        function fetchChecked(address, digest, type, abortController) {
            var controller = abortController || new AbortController();
            var stall = null;

            function wait() {
                clearTimeout(stall);
                stall = setTimeout(function () {
                    controller.abort();
                }, STALL_TIMEOUT);
            }

            wait();
            return versionedFetch(address, { cache: 'no-cache', signal: controller.signal }).then(function (response) {
                if (!response.ok || !response.body) {
                    throw new Error('Could not download ' + address);
                }
                var contentType = type || (/\.wasm$/.test(new URL(address).pathname)
                    ? 'application/wasm'
                    : response.headers.get('Content-Type') || 'application/octet-stream');
                var reader = response.body.getReader();
                var chunks = [];
                var length = 0;
                return (function pump() {
                    return reader.read().then(function (chunk) {
                        if (chunk.done) {
                            return undefined;
                        }
                        wait();
                        chunks.push(chunk.value);
                        length += chunk.value.byteLength;
                        received += chunk.value.byteLength;
                        schedule();
                        return pump();
                    });
                })().then(function () {
                    clearTimeout(stall);
                    var bytes = new Uint8Array(length);
                    var offset = 0;
                    chunks.forEach(function (chunk) {
                        bytes.set(chunk, offset);
                        offset += chunk.byteLength;
                    });
                    return window.crypto.subtle.digest('SHA-256', bytes).then(function (hash) {
                        var hex = Array.prototype.map.call(new Uint8Array(hash), function (value) {
                            return (value < 16 ? '0' : '') + value.toString(16);
                        }).join('');
                        if (hex !== digest) {
                            throw new Error('Unexpected content at ' + address);
                        }
                        return new Response(bytes, { headers: { 'Content-Type': contentType } });
                    });
                });
            }).catch(function (error) {
                clearTimeout(stall);
                throw error;
            });
        }

        /**
         * Deletes what the cache holds of other builds, once the app is up - but only while the page kept is this
         * one, since a page of a later build is kept with its files, which are not this page's to delete.
         */
        function forgetOtherBuilds() {
            if (!cache) {
                return;
            }
            isPageKept().then(function (isKept) {
                if (!isKept) {
                    return undefined;
                }
                return cachedAddresses().then(function (kept) {
                    return Promise.all(window.campfireLaunch.staleAddresses(BUILD.files, kept, folder).map(function (address) {
                        return cache.delete(address);
                    }));
                });
            }).catch(function () {
            });
        }

        /**
         * A lock is held for as long as the promise its callback returns is pending, and this one never settles:
         * the library is this page's until the page is closed or navigates away, which is when the browser lets
         * go of it. A browser without Web Locks, or one that refuses them here, starts the app as it always has.
         */
        function claimLibrary(onGranted, onRefused) {
            if (!navigator.locks || !navigator.locks.request) {
                onGranted();
                return;
            }
            navigator.locks.request(LOCK_NAME, { ifAvailable: true }, function (lock) {
                if (!lock) {
                    onRefused();
                    return undefined;
                }
                onGranted();
                return new Promise(function () {});
            }).catch(onGranted);
        }

        // A page that is put into the back/forward cache loses its locks, and gets none back when it is restored -
        // pressing Back on the consent page is how that happens. It asks again, and if another tab has taken the
        // library in the meantime it reloads, which lands on the page above.
        window.addEventListener('pageshow', function (event) {
            if (event.persisted && hasStarted) {
                claimLibrary(function () {}, function () {
                    location.reload();
                });
            }
        });

        // Asked before the library is claimed and before anything of the app is fetched: a browser that cannot run
        // it would otherwise download sixteen megabytes to find that out, and be told to check its connection.
        if (isBrowserSupported()) {
            claimLibrary(launch, showAlreadyOpen);
        } else {
            showUnsupported();
        }
    })();
</script>
</body>
</html>
