# Build configuration
#
# Every value here is a default that makes a fresh clone build every variant, and none of them is a secret: the
# signing defaults point at the debug keystore that is committed next to them, and an empty sync key simply means
# the build has no cloud provider to offer.
#
# Real credentials go in local.properties, which is never committed and overrides anything below - see CLAUDE.md.
campfire.versionName=4.0.1
campfire.versionCode=29

# Android signing. The defaults are the standard Android debug keystore, so a release build works out of the box and
# produces something installable; it is simply not something that can be published.
campfire.android.keyAlias=androiddebugkey
campfire.android.keyPassword=android
campfire.android.keystoreFile=internal.keystore
campfire.android.keystorePassword=android

# Sync. Empty means no provider is registered at all and the settings screen says the build has no sync credentials,
# which is the right thing for a checkout that nobody has configured.
campfire.dropbox.appKey=

# Web. Precompressing the distribution is only of use to a host that serves the .br / .gz copies next to
# the originals, which GitHub Pages - where this is deployed - does not: it gzips on the fly instead (at
# the same ratio, .wasm included) and ignores the copies. So it is off, and costs half a minute of build
# time whenever it is turned on for a host that was configured to look for them.
campfire.web.precompress=false

org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4096M
kotlin.code.style=official
kotlin.native.binary.gc=cms
android.enableR8.fullMode=true
android.useAndroidX=true
android.nonTransitiveRClass=true
