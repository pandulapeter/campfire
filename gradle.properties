# Every campfire.* value below is a default that lets a fresh clone build every variant, and none of them is a secret.
# Real credentials go in local.properties, which is never committed and overrides anything here (see CLAUDE.md).

# ---- Versions ----------------------------------------------------------------------------------------------------
# Both are shared by every platform. The build number is Android's version code and the CFBundleVersion of the Apple
# builds, and has to be raised for every release: each store refuses a number it has seen.
campfire.versionName=4.3.0
campfire.buildNumber=39

# ---- Android signing ---------------------------------------------------------------------------------------------
# The debug keystore committed next to the app: installable, not publishable.
campfire.android.keyAlias=androiddebugkey
campfire.android.keyPassword=android
campfire.android.keystoreFile=internal.keystore
campfire.android.keystorePassword=android

# ---- macOS signing (Mac App Store build only) --------------------------------------------------------------------
# Empty means signed ad hoc. The identity is "Name (TEAMID)" without the certificate type prefix, which the build adds.
# The keychain is only needed when more than one keychain holds a matching certificate. Profile paths are relative to
# app/desktop: the app's and the Java runtime's (App ID com.oracle.java.com.pandulapeter.campfire).
campfire.mac.signingIdentity=
campfire.mac.signingKeychain=
campfire.mac.provisioningProfile=
campfire.mac.runtimeProvisioningProfile=

# ---- Sync --------------------------------------------------------------------------------------------------------
# Empty means no provider at all, and Settings says sync is not configured.
campfire.dropbox.appKey=

# ---- Web ---------------------------------------------------------------------------------------------------------
# Off, because GitHub Pages ignores precompressed copies and gzips on the fly.
campfire.web.precompress=false

# ---- Gradle and Kotlin -------------------------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4096M
kotlin.code.style=official
kotlin.native.binary.gc=cms
# The Linux and Windows runners that package the desktop builds cannot build for iOS, and need no word about it.
kotlin.native.ignoreDisabledTargets=true
android.enableR8.fullMode=true
android.useAndroidX=true
android.nonTransitiveRClass=true
