# Builds the Mac App Store package of the desktop app, sandboxed and signed, and uploads it to App Store Connect, where
# it lands in TestFlight. Called by a release, it then waits for the build to be processed and submits it for review
# with the release's notes as its "What's New", to be released as soon as Apple approves it; dispatched by hand, it
# does so only when asked. Either way a green run means submitted, not accepted — review answers by email.
#
# The build is Apple silicon only: jpackage packages for the machine it runs on, and App Store Connect takes an
# arm64-only Mac app from macOS 12 on. campfire.desktop.distribution=mac-app-store is what signs and sandboxes it, and
# what takes the donation link out of the app (guideline 3.1.1).
#
# Nothing it signs with is stored anywhere, so nothing of it can expire: the run creates a Mac App Distribution and a
# Mac Installer Distribution certificate for a key made on the runner, and the two Mac App Store provisioning profiles
# (the app's and the bundled Java runtime's) that name them, through the App Store Connect API
# (.github/scripts/app_store_signing.py), and revokes and deletes all of it at the end. That takes an API key with the
# Admin role.
#
# Called by release.yml for every release; dispatched by hand to upload a release again, which App Store Connect only
# accepts under a build number it has not seen yet — hence the override, which leaves gradle.properties as it was.

name: 'Publish macOS'

on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true
      release_notes:
        type: string
        required: false
      submit_for_review:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag of the release to build and upload'
        type: string
        required: true
      build_number:
        description: 'Build number to upload under instead of campfire.buildNumber (for a repeated upload)'
        type: string
        required: false
      submit_for_review:
        description: 'Submit the build for review once it has been processed, to be released as soon as it is approved'
        type: boolean
        default: false
      release_notes:
        description: '"What''s New" for the submission, use \n for line breaks'
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build and Upload
    runs-on: macos-latest
    steps:
      # `gh secret set` stores an empty value without complaint when it has no terminal to prompt on, and an empty or
      # wrongly encoded secret only surfaces much later as a cryptic codesign or jpackage failure.
      - name: Check the secrets
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          PROBLEMS=0
          problem() {
            echo "::error::$1: $2" >&2
            PROBLEMS=$((PROBLEMS + 1))
          }
          # The empty string is the checked-in default, because a fresh clone has to build without a secret, so
          # nothing downstream would notice a published build that has no sync provider at all.
          [ -n "$DROPBOX_APP_KEY" ] || problem DROPBOX_APP_KEY "empty or not visible to this workflow"
          if [ -z "$ASC_KEY_ID" ]; then
            problem APP_STORE_CONNECT_KEY_ID "empty or unset"
          elif ! [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            problem APP_STORE_CONNECT_KEY_ID "expected 10 upper case letters and digits, as in the AuthKey_<id>.p8 file name"
          fi
          if [ -z "$ASC_ISSUER_ID" ]; then
            problem APP_STORE_CONNECT_ISSUER_ID "empty or unset"
          elif ! [[ "$ASC_ISSUER_ID" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            problem APP_STORE_CONNECT_ISSUER_ID "expected a UUID, found ${#ASC_ISSUER_ID} characters"
          fi
          if [ -z "$ASC_PRIVATE_KEY" ]; then
            problem APP_STORE_CONNECT_PRIVATE_KEY "empty or unset"
          elif ! printf '%s' "$ASC_PRIVATE_KEY" | grep -q 'BEGIN PRIVATE KEY'; then
            problem APP_STORE_CONNECT_PRIVATE_KEY "expected the text of the AuthKey_<id>.p8 file, BEGIN PRIVATE KEY line included, not base64"
          fi
          if [ "$PROBLEMS" -gt 0 ]; then
            echo "Set them from a terminal that can prompt for hidden input: gh secret set <name> --repo $GITHUB_REPOSITORY" >&2
            exit 1
          fi
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag }}
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
          cache: 'gradle'
      - name: Set up code signing
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          # altool finds the key by its name in this directory; the signing script is given the path.
          ASC_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          mkdir -p "$(dirname "$ASC_KEY_PATH")"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"
          echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"
          export ASC_KEY_PATH
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Long enough that the keychain does not lock itself in the middle of a slow Kotlin build.
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          SIGNING=.github/scripts/app_store_signing.py
          python3 "$SIGNING" certificate MAC_APP_DISTRIBUTION "$KEYCHAIN_PATH"
          python3 "$SIGNING" certificate MAC_INSTALLER_DISTRIBUTION "$KEYCHAIN_PATH"
          python3 "$SIGNING" profile MAC_APP_STORE com.pandulapeter.campfire MAC_APP_DISTRIBUTION "$RUNNER_TEMP/embedded.provisionprofile"
          python3 "$SIGNING" profile MAC_APP_STORE com.oracle.java.com.pandulapeter.campfire MAC_APP_DISTRIBUTION "$RUNNER_TEMP/runtime.provisionprofile"
          # Without the partition list codesign and productbuild stop to ask for the keychain password, which nobody
          # can type here.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          # The build is given the name the two certificates share, without the prefix it adds itself.
          IDENTITY=$(security find-identity -v "$KEYCHAIN_PATH" | sed -n 's/.*"3rd Party Mac Developer Application: \(.*\)"$/\1/p' | head -n 1)
          if [ -z "$IDENTITY" ] || ! security find-identity -v "$KEYCHAIN_PATH" | grep -qF "3rd Party Mac Developer Installer: $IDENTITY"; then
            security find-identity -v "$KEYCHAIN_PATH"
            echo "::error::The keychain does not hold both signing identities the certificates were created for." >&2
            exit 1
          fi
          echo "MAC_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      # Where a developer's machine keeps the same values, so that the Gradle invocation is the one CLAUDE.md names.
      # Backslashes are doubled because java.util.Properties reads one as an escape.
      - name: Write local.properties
        id: version
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          BUILD_NUMBER_OVERRIDE: ${{ inputs.build_number }}
        run: |
          VERSION_NAME=$(sed -n 's/^campfire\.versionName=//p' gradle.properties | tr -d '\r')
          BUILD_NUMBER=$(sed -n 's/^campfire\.buildNumber=//p' gradle.properties | tr -d '\r')
          {
            printf 'campfire.dropbox.appKey=%s\n' "${DROPBOX_APP_KEY//\\/\\\\}"
            printf 'campfire.mac.signingIdentity=%s\n' "$MAC_SIGNING_IDENTITY"
            printf 'campfire.mac.signingKeychain=%s\n' "$KEYCHAIN_PATH"
            printf 'campfire.mac.provisioningProfile=%s\n' "$RUNNER_TEMP/embedded.provisionprofile"
            printf 'campfire.mac.runtimeProvisioningProfile=%s\n' "$RUNNER_TEMP/runtime.provisionprofile"
          } > local.properties
          if [ -n "$BUILD_NUMBER_OVERRIDE" ]; then
            if ! [[ "$BUILD_NUMBER_OVERRIDE" =~ ^[0-9]+$ ]]; then
              echo "::error::The build number override has to be a whole number, not \"$BUILD_NUMBER_OVERRIDE\"." >&2
              exit 1
            fi
            BUILD_NUMBER=$BUILD_NUMBER_OVERRIDE
            printf 'campfire.buildNumber=%s\n' "$BUILD_NUMBER" >> local.properties
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION_NAME ($BUILD_NUMBER), signed as $MAC_SIGNING_IDENTITY"
      - name: Build the package
        run: |
          ./gradlew :app:desktop:packageReleasePkg -Pcampfire.desktop.distribution=mac-app-store
          ./gradlew --stop
      # A version that did not reach the Info.plist would be uploaded under whatever the plugin defaults to, which App
      # Store Connect takes for an old build.
      - name: Check the packaged version
        run: |
          PLIST="app/desktop/build/compose/binaries/main-release/app/Campfire.app/Contents/Info.plist"
          PACKAGED_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")
          PACKAGED_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")
          echo "Packaged $PACKAGED_NAME ($PACKAGED_BUILD)"
          if [ "$PACKAGED_NAME" != "${{ steps.version.outputs.name }}" ] || [ "$PACKAGED_BUILD" != "${{ steps.version.outputs.build }}" ]; then
            echo "::error::The package does not carry ${{ steps.version.outputs.name }} (${{ steps.version.outputs.build }})." >&2
            exit 1
          fi
      # ProGuard breaks an application in ways that only starting it shows, and the sandbox can break it in more. A
      # build signed for the store does not start outside TestFlight, so a copy is signed ad hoc with the same
      # entitlements, less the two that tie it to the App ID, which only a provisioning profile may grant. The demo
      # library appearing in the fresh container proves that Koin started, the window composed and the library was
      # written inside the sandbox; the process still being there a while later proves the first frames did not kill
      # it.
      - name: Start the release build once
        run: |
          COPY="$RUNNER_TEMP/Campfire.app"
          LOG="$RUNNER_TEMP/campfire.log"
          DATA="$HOME/Library/Containers/com.pandulapeter.campfire/Data/Library/Application Support/Campfire"
          cp -R app/desktop/build/compose/binaries/main-release/app/Campfire.app "$COPY"
          rm -f "$COPY/Contents/embedded.provisionprofile" "$COPY/Contents/runtime/Contents/embedded.provisionprofile"
          python3 - app/desktop/app-store.entitlements "$RUNNER_TEMP/local.entitlements" <<'PYTHON'
          import plistlib, sys
          with open(sys.argv[1], "rb") as source:
              entitlements = plistlib.load(source)
          entitlements.pop("com.apple.application-identifier")
          entitlements.pop("com.apple.developer.team-identifier")
          with open(sys.argv[2], "wb") as target:
              plistlib.dump(entitlements, target)
          PYTHON
          find "$COPY/Contents/runtime" "$COPY/Contents/app" -type f \( -name '*.dylib' -o -perm -u+x \) -print0 \
            | xargs -0 codesign --force --sign - --options runtime --entitlements app/desktop/app-store-runtime.entitlements
          codesign --force --sign - "$COPY/Contents/runtime"
          codesign --force --sign - --options runtime --entitlements "$RUNNER_TEMP/local.entitlements" "$COPY"
          "$COPY/Contents/MacOS/Campfire" > "$LOG" 2>&1 &
          PID=$!
          fail() {
            echo "::error::$1"
            cat "$LOG"
            kill "$PID" 2> /dev/null || true
            exit 1
          }
          for _ in $(seq 120); do
            kill -0 "$PID" 2> /dev/null || fail "The release build exited on its own before the library was written."
            if [ -f "$DATA/preferences/preferences.json" ] && ls "$DATA/library/songs/"*.cho > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          ls "$DATA/library/songs/"*.cho > /dev/null 2>&1 || fail "The release build did not write the demo library in two minutes."
          sleep 15
          kill -0 "$PID" 2> /dev/null || fail "The release build exited on its own after it had written the library."
          grep -q "Exception" "$LOG" && fail "The release build logged an exception."
          kill "$PID" 2> /dev/null || true
          cat "$LOG"
          echo "The release build started in the sandbox and wrote: $(ls "$DATA/library/songs")"
      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          PACKAGE=$(find app/desktop/build/compose/binaries/main-release/pkg -name '*.pkg' | head -n 1)
          if [ -z "$PACKAGE" ]; then
            echo "::error::No .pkg was built." >&2
            exit 1
          fi
          xcrun altool --upload-app --type macos --file "$PACKAGE" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "Uploaded ${{ steps.version.outputs.name }} (${{ steps.version.outputs.build }}). It appears in TestFlight once App Store Connect has processed it."
      # Waits for App Store Connect to process the build, which can take half an hour, and submits it with the release's
      # notes as its "What's New", to be released as soon as it is approved (.github/scripts/app_store_submission.py).
      - name: Submit for review
        if: inputs.submit_for_review
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          # A single-line text box has no other way to ask for a line break; the notes release.yml passes on are
          # carried through as they are, backslashes included.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            printf '%b\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/release-notes.txt"
          else
            printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/release-notes.txt"
          fi
          python3 .github/scripts/app_store_submission.py com.pandulapeter.campfire MAC_OS \
            "${{ steps.version.outputs.name }}" "${{ steps.version.outputs.build }}" "$RUNNER_TEMP/release-notes.txt"
      # Whatever the run got as far as creating, and nothing else, whether or not the build went through.
      - name: Revoke the signing identities
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          if [ -f "$RUNNER_TEMP/app-store-signing.json" ]; then
            python3 .github/scripts/app_store_signing.py cleanup
          fi
      - name: Clean up credentials
        if: always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          rm -f "$HOME/.appstoreconnect/private_keys/"*.p8 "$RUNNER_TEMP/"*.provisionprofile local.properties
