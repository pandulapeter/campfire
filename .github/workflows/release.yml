# The whole release, started by publishing a GitHub release: the Android build goes to Play and onto the release, the
# web build onto the website, and the desktop installers and the iOS build onto the release. Each of the four is a
# workflow of its own that this one calls, so any of them can also be dispatched by hand, and a job that failed here
# can be run again from the run's page without repeating the ones that went through.
#
# The "what's new" text for the stores is read out of the release's description, from comments the rendered page hides:
#
#   <!-- whats-new en-US
#   - Up to 500 characters of plain text
#   -->
#   <!-- play-store update-priority: 0 -->
#
# The notes are written for every store that shows them, and Play is the one this reads them for so far; the priority
# is Play's alone (see the Updates section of CLAUDE.md for what the number decides). Both are optional. Without the
# notes the visible description stands in for them, with its markdown taken out, and without the priority it is 0.

name: 'Release'

on:
  release:
    # Not "published", which a pre-release answers to as well: a pre-release goes to nobody's store.
    types: [released]

permissions:
  contents: write

jobs:
  prepare:
    name: Check the version and read the release notes
    runs-on: ubuntu-latest
    outputs:
      release_notes: ${{ steps.notes.outputs.release_notes }}
      update_priority: ${{ steps.notes.outputs.update_priority }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      # A tag on a commit that still carries the previous version would build, sign and submit that version again
      # under a new name, and the stores would be the first to notice.
      - name: Check the tag against the version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION_NAME=$(sed -n 's/^campfire\.versionName=//p' gradle.properties)
          if [ "${RELEASE_TAG#v}" != "$VERSION_NAME" ]; then
            echo "The release is tagged $RELEASE_TAG, but gradle.properties at that tag says campfire.versionName=$VERSION_NAME" >&2
            exit 1
          fi
          echo "Releasing version $VERSION_NAME"
      # A published build with an empty key has no sync provider at all, and nothing downstream would notice: the
      # empty string is the checked-in default, because a fresh clone has to build without a secret. Asked here as
      # well as in each workflow, so a release fails before four builds have run rather than after.
      - name: Check the sync credentials
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
        run: |
          if [ -z "$DROPBOX_APP_KEY" ]; then
            echo "::error::DROPBOX_APP_KEY is empty or not visible to this workflow. A release built without it would have no sync provider at all." >&2
            exit 1
          fi
      - name: Read the release notes
        id: notes
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          python3 - <<'PYTHON'
          import os
          import re

          body = os.environ["RELEASE_BODY"].replace("\r\n", "\n")

          match = re.search(r"<!--\s*whats-new\s+en-US\s*\n(.*?)-->", body, re.S)
          english = match.group(1).strip() if match else ""
          if not english:
              visible = re.sub(r"<!--.*?-->", "", body, flags=re.S)
              visible = re.sub(r"\[([^\]]+)\]\([^)]+\)", r"\1", visible)
              english = re.sub(r"\*\*|`", "", visible).strip()
          priority = re.search(r"<!--\s*play-store\s+update-priority:\s*([0-5])\s*-->", body)

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"release_notes<<END_OF_RELEASE_NOTES\n{english}\nEND_OF_RELEASE_NOTES\n")
              output.write(f"update_priority={priority.group(1) if priority else '0'}\n")
          PYTHON

  android:
    name: Android
    needs: prepare
    uses: ./.github/workflows/android-publish.yml
    with:
      update_priority: ${{ needs.prepare.outputs.update_priority }}
      release_notes: ${{ needs.prepare.outputs.release_notes }}
      release_tag: ${{ github.event.release.tag_name }}
    secrets: inherit

  web:
    name: Web
    needs: prepare
    uses: ./.github/workflows/web-publish.yml
    secrets: inherit

  desktop:
    name: Desktop
    needs: prepare
    uses: ./.github/workflows/desktop-publish.yml
    with:
      release_tag: ${{ github.event.release.tag_name }}
    secrets: inherit

  ios:
    name: iOS
    needs: prepare
    uses: ./.github/workflows/ios-publish.yml
    with:
      release_tag: ${{ github.event.release.tag_name }}
    secrets: inherit
