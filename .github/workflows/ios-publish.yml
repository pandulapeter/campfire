# Builds the iOS app, signs it for the App Store and uploads it to App Store Connect, where it lands in TestFlight.
# Called by a release, it then waits for the build to be processed and submits it for review with the release's notes
# as its "What's New", to be released as soon as Apple approves it; dispatched by hand, it does so only when asked.
# Either way a green run means submitted, not accepted — review answers by email.
#
# Nothing it signs with is stored anywhere, so nothing of it can expire: the run creates an Apple Distribution
# certificate for a key made on the runner through the App Store Connect API (.github/scripts/app_store_signing.py),
# xcodebuild creates the App Store provisioning profile for it with the same key, and the certificate is revoked at the
# end. That takes an API key with the Admin role.
#
# Called by release.yml for every release; dispatched by hand to upload a release again, which App Store Connect only
# accepts under a build number it has not seen yet — hence the override, which leaves gradle.properties as it was.

name: 'Publish iOS'

on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true
      release_notes:
        type: string
        required: false
      submit_for_review:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag of the release to build and upload'
        type: string
        required: true
      build_number:
        description: 'Build number to upload under instead of campfire.buildNumber (for a repeated upload)'
        type: string
        required: false
      submit_for_review:
        description: 'Submit the build for review once it has been processed, to be released as soon as it is approved'
        type: boolean
        default: false
      release_notes:
        description: '"What''s New" for the submission, use \n for line breaks'
        type: string
        required: false

permissions:
  contents: read

env:
  XCODE_PROJECT: app/ios/iosApp/iosApp.xcodeproj
  # No scheme is checked in; xcodebuild creates this one for the target of the same name when it finds none.
  XCODE_SCHEME: iosApp

jobs:
  build:
    name: Build and Upload
    # Named rather than "latest", so that the Xcode the project was last saved with is the one that opens it.
    runs-on: macos-26
    steps:
      # `gh secret set` stores an empty value without complaint when it has no terminal to prompt on, and an empty or
      # base64-encoded-by-mistake secret only surfaces much later as a cryptic codesign or xcodebuild failure.
      - name: Check the secrets
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          PROBLEMS=0
          problem() {
            echo "::error::$1: $2" >&2
            PROBLEMS=$((PROBLEMS + 1))
          }
          # The empty string is the checked-in default, because a fresh clone has to build without a secret, so
          # nothing downstream would notice a published build that has no sync provider at all.
          [ -n "$DROPBOX_APP_KEY" ] || problem DROPBOX_APP_KEY "empty or not visible to this workflow"
          if [ -z "$ASC_KEY_ID" ]; then
            problem APP_STORE_CONNECT_KEY_ID "empty or unset"
          elif ! [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            problem APP_STORE_CONNECT_KEY_ID "expected 10 upper case letters and digits, as in the AuthKey_<id>.p8 file name"
          fi
          if [ -z "$ASC_ISSUER_ID" ]; then
            problem APP_STORE_CONNECT_ISSUER_ID "empty or unset"
          elif ! [[ "$ASC_ISSUER_ID" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            problem APP_STORE_CONNECT_ISSUER_ID "expected a UUID, found ${#ASC_ISSUER_ID} characters"
          fi
          if [ -z "$ASC_PRIVATE_KEY" ]; then
            problem APP_STORE_CONNECT_PRIVATE_KEY "empty or unset"
          elif ! printf '%s' "$ASC_PRIVATE_KEY" | grep -q 'BEGIN PRIVATE KEY'; then
            problem APP_STORE_CONNECT_PRIVATE_KEY "expected the text of the AuthKey_<id>.p8 file, BEGIN PRIVATE KEY line included, not base64"
          fi
          if [ "$PROBLEMS" -gt 0 ]; then
            echo "Set them from a terminal that can prompt for hidden input: gh secret set <name> --repo $GITHUB_REPOSITORY" >&2
            exit 1
          fi
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag }}
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
          cache: 'gradle'
      # Gradle is started by a build phase of the Xcode project here, which passes it no properties, and the version
      # build phase reads local.properties after gradle.properties with the last value winning — so both the sync key
      # and a build number override go where a developer's own machine keeps them.
      - name: Write local.properties
        id: version
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          BUILD_NUMBER_OVERRIDE: ${{ inputs.build_number }}
        run: |
          VERSION_NAME=$(sed -n 's/^campfire\.versionName=//p' gradle.properties | tr -d '\r')
          BUILD_NUMBER=$(sed -n 's/^campfire\.buildNumber=//p' gradle.properties | tr -d '\r')
          printf 'campfire.dropbox.appKey=%s\n' "${DROPBOX_APP_KEY//\\/\\\\}" > local.properties
          if [ -n "$BUILD_NUMBER_OVERRIDE" ]; then
            if ! [[ "$BUILD_NUMBER_OVERRIDE" =~ ^[0-9]+$ ]]; then
              echo "::error::The build number override has to be a whole number, not \"$BUILD_NUMBER_OVERRIDE\"." >&2
              exit 1
            fi
            BUILD_NUMBER=$BUILD_NUMBER_OVERRIDE
            printf 'campfire.buildNumber=%s\n' "$BUILD_NUMBER" >> local.properties
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION_NAME ($BUILD_NUMBER) with $(xcodebuild -version | head -n 1)"
      - name: Set up code signing
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          # altool looks for the key by its name in this directory; xcodebuild and the signing script are given the path.
          ASC_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          mkdir -p "$(dirname "$ASC_KEY_PATH")"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"
          echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"
          export ASC_KEY_PATH
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Long enough that the keychain does not lock itself in the middle of a slow Kotlin build.
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          python3 .github/scripts/app_store_signing.py certificate DISTRIBUTION "$KEYCHAIN_PATH"
          # Without the partition list codesign stops to ask for the keychain password, which nobody can type here.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q 'Apple Distribution'; then
            security find-identity -v "$KEYCHAIN_PATH"
            echo "::error::The keychain holds no Apple Distribution signing identity for the certificate the run created." >&2
            exit 1
          fi
      - name: Archive the app
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Campfire.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"
      # The version is written into the Info.plist by a build phase rather than by a build setting, so a phase that
      # silently did not run would upload a build numbered 0, which App Store Connect takes for an old one.
      - name: Check the archived version
        run: |
          PLIST="$RUNNER_TEMP/Campfire.xcarchive/Products/Applications/Campfire.app/Info.plist"
          ARCHIVED_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")
          ARCHIVED_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")
          echo "Archived $ARCHIVED_NAME ($ARCHIVED_BUILD)"
          if [ "$ARCHIVED_NAME" != "${{ steps.version.outputs.name }}" ] || [ "$ARCHIVED_BUILD" != "${{ steps.version.outputs.build }}" ]; then
            echo "::error::The archive does not carry ${{ steps.version.outputs.name }} (${{ steps.version.outputs.build }})." >&2
            exit 1
          fi
      - name: Export the .ipa
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          TEAM_ID=$(sed -n 's/^TEAM_ID *= *//p' app/ios/iosApp/Configuration/Config.xcconfig)
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>destination</key>
            <string>export</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Campfire.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' | head -n 1)
          if [ -z "$IPA" ]; then
            echo "::error::No .ipa was exported to $RUNNER_TEMP/export" >&2
            exit 1
          fi
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "Uploaded ${{ steps.version.outputs.name }} (${{ steps.version.outputs.build }}). It appears in TestFlight once App Store Connect has processed it."
      # Waits for App Store Connect to process the build, which can take half an hour, and submits it with the release's
      # notes as its "What's New", to be released as soon as it is approved (.github/scripts/app_store_submission.py).
      - name: Submit for review
        if: inputs.submit_for_review
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          # A single-line text box has no other way to ask for a line break; the notes release.yml passes on are
          # carried through as they are, backslashes included.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            printf '%b\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/release-notes.txt"
          else
            printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/release-notes.txt"
          fi
          python3 .github/scripts/app_store_submission.py com.pandulapeter.campfire IOS \
            "${{ steps.version.outputs.name }}" "${{ steps.version.outputs.build }}" "$RUNNER_TEMP/release-notes.txt"
      # Whatever the run got as far as creating, and nothing else, whether or not the build went through. The profile
      # xcodebuild made for the certificate is left to it: the next run's xcodebuild makes a new one.
      - name: Revoke the signing certificate
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          if [ -f "$RUNNER_TEMP/app-store-signing.json" ]; then
            python3 .github/scripts/app_store_signing.py cleanup
          fi
      - name: Clean up credentials
        if: always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          rm -f "$HOME/.appstoreconnect/private_keys/"*.p8
