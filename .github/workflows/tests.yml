# Every test the repository has: the unit tests of every module, run on the desktop target, the Node tests of the
# web build's storage worker and offline support and the Python test of the release description's parser — and a
# compilation of every platform's code, the iOS one on a macOS runner, since desktopTest compiles only the desktop
# target's. Run on every pull request, every night on the default branch, which catches what was pushed there
# directly, and by publish-all.yml before it starts a single store build, so a failing test or a platform that does
# not compile stops every store's release rather than one of them.

name: 'Tests'

on:
  pull_request:
  schedule:
    # A scheduled run's failure is emailed to whoever last changed this line.
    - cron: '0 2 * * *'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a pull request makes the run for the previous one moot. Nothing else shares a group: the ref of a
  # release's run is its tag, and a scheduled run is never cancelled by another.
  group: test-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Run the tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        # The JetBrains runtime is looked up through the GitHub API, which setup-java only authenticates with this
        # variable (not its token input); unauthenticated, the runner's shared address runs out of requests.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          distribution: 'jetbrains'
          java-version: 21
      # Caches the dependencies, the wrapper and the build cache's task outputs. The cache is written by runs on the
      # default branch (the nightly one) and only read by every other run, a release's included.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      # Before Gradle, whose failure would skip every later step. The parser of a release's description is what
      # publish-all.yml stops a release with, before a build starts.
      - name: Run the release description parser's tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      # Every source file, script, workflow, XML resource and CLAUDE.md carries the MPL-2.0 header.
      - name: Check the license headers
        run: python3 .github/scripts/check_license_headers.py
      # The unqualified tasks run in every module that has them, so a module that gains tests is covered without a
      # change here. --continue reports the failures of every module rather than only the first, and a ktlint violation
      # (spotlessCheck) together with them.
      - name: Run the unit tests
        run: ./gradlew spotlessCheck desktopTest --continue
      - name: Upload failed unit test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/desktopTest/**
            **/build/test-results/desktopTest/*.xml
          retention-days: 7
      # The web build's storage worker and what keeps the build in the browser are JavaScript, tested by Node rather
      # than by Gradle.
      - name: Run the web build's JavaScript tests
        run: node --test app/web/tests/opfs-writer.test.cjs app/web/tests/offline.test.cjs

  compile:
    name: Compile every platform
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        # The JetBrains runtime is looked up through the GitHub API, which setup-java only authenticates with this
        # variable (not its token input); unauthenticated, the runner's shared address runs out of requests.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          distribution: 'jetbrains'
          java-version: 21
      # Caches the dependencies, the wrapper and the build cache's task outputs. The cache is written by runs on the
      # default branch (the nightly one) and only read by every other run, a release's included.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      # desktopTest compiles commonMain and desktopMain alone. The Android app compiles every library's androidMain, and
      # the web one their wasmJsMain; the distribution's Binaryen pass is left to publish-web.yml, since the compilation
      # is what catches an error.
      - name: Compile the Android, desktop and web apps, the Baseline Profile generator and the screenshot tool
        run: >-
          ./gradlew --continue
          :app:android:assembleDebug
          :app:baselineprofile:compileNonMinifiedReleaseKotlin
          :app:desktop:compileKotlin
          :app:web:compileProductionExecutableKotlinWasmJs
          :tools:screenshots:compileKotlin

  compile-ios:
    name: Compile the iOS app
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        # The JetBrains runtime is looked up through the GitHub API, which setup-java only authenticates with this
        # variable (not its token input); unauthenticated, the runner's shared address runs out of requests.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          distribution: 'jetbrains'
          java-version: 21
      # Caches the dependencies, the wrapper and the build cache's task outputs. The cache is written by runs on the
      # default branch (the nightly one) and only read by every other run, a release's included.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      # Kotlin/Native compiles inside the Gradle daemon, which runs out of the 4 GB gradle.properties gives it, as in
      # publish-ios.yml.
      - name: Give the Gradle daemon more memory
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8' >> ~/.gradle/gradle.properties
      # Every library's iosMain and the framework the Xcode project embeds.
      - name: Compile the iOS framework
        run: ./gradlew :app:ios:linkDebugFrameworkIosSimulatorArm64
