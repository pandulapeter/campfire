# Every test the repository has: the unit tests of every module, run on the desktop target, the Node tests of the
# web build's storage worker and offline support and the Python test of the release description's parser. Run on every pull request, every night on the default branch, which catches what was
# pushed there directly, and by publish-all.yml before it starts a single store build, so a failing test stops a
# release.

name: 'Tests'

on:
  pull_request:
  schedule:
    # A scheduled run's failure is emailed to whoever last changed this line.
    - cron: '0 2 * * *'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a pull request makes the run for the previous one moot. Nothing else shares a group: the ref of a
  # release's run is its tag, and a scheduled run is never cancelled by another.
  group: test-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Run the tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        # The JetBrains runtime is looked up through the GitHub API, which setup-java only authenticates with this
        # variable (not its token input); unauthenticated, the runner's shared address runs out of requests.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          distribution: 'jetbrains'
          java-version: 21
      # Caches the dependencies, the wrapper and the build cache's task outputs. The cache is written by runs on the
      # default branch (the nightly one) and only read by every other run, a release's included.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      # Before Gradle, whose failure would skip every later step. The parser of a release's description is what
      # publish-all.yml stops a release with, before a build starts.
      - name: Run the release description parser's tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      # Every source file, script, workflow, XML resource and CLAUDE.md carries the MPL-2.0 header.
      - name: Check the license headers
        run: python3 .github/scripts/check_license_headers.py
      # The unqualified tasks run in every module that has them, so a module that gains tests is covered without a
      # change here. --continue reports the failures of every module rather than only the first, and a ktlint violation
      # (spotlessCheck) together with them.
      - name: Run the unit tests
        run: ./gradlew spotlessCheck desktopTest --continue
      - name: Upload failed unit test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/desktopTest/**
            **/build/test-results/desktopTest/*.xml
          retention-days: 7
      # The web build's storage worker and what keeps the build in the browser are JavaScript, tested by Node rather
      # than by Gradle.
      - name: Run the web build's JavaScript tests
        run: node --test app/web/tests/opfs-writer.test.cjs app/web/tests/offline.test.cjs
