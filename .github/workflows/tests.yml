# Every test the repository has: the unit tests of every module, run on the desktop target and again on Windows, the UI
# tests, the large-archive import test, the build logic's tests, the storage contract in headless Chrome and on the iOS
# simulator, the Node tests of the web build's storage worker and offline support, and every Python script's tests
# (test_*.py); the checks the pre-commit hook runs too (license headers, store listings, regular expressions, iOS-tested
# test names, file and function sizes, presentation layers, and sync seams); and a compilation of every platform's
# code, the iOS one on a macOS runner, since desktopTest compiles only the desktop target's; and the release builds
# started as they ship: Android's on an emulator, the desktop's ProGuarded app image, and the web's in headless Chrome.
# Run on every pull request, on every push to main (a merged pull request or a direct push) that changes more than
# documentation/, and by publish-all.yml before it starts a single store build, so a failing test or a platform that
# does not compile stops every store's release rather than one of them.

name: 'Run all tests'

on:
  pull_request:
  push:
    branches: [ main ]
    # Notes, plans, the README's images, and the store listings: only the listings' length check reads any of them, and
    # the pre-commit hook and a release's run check those. Not on pull requests, whose required check would wait for a
    # run that never comes.
    paths-ignore: [ 'documentation/**' ]
  workflow_call:
    outputs:
      passed:
        description: "'true' when every test passed, a compile-ios that got no runner counted by its second try"
        value: ${{ jobs.passed.outputs.passed }}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a pull request makes the run for the previous one moot, and a new push to main the run for the
  # previous push: the newer run tests everything the older one would have, so a failure names the pushes since the last
  # finished run rather than one commit, and the size check below judges only the newest push (the pre-commit hook
  # judged every commit already). A release's run shares no group.
  group: test-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Run the tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up JDK 21 and Gradle
        uses: ./.github/actions/setup-jdk
      # Before Gradle, whose failure would skip every later step. The parser of a release's description is what
      # publish-all.yml stops a release with, before a build starts.
      # The contact sheets of the release's screenshots are drawn with Pillow; the store scripts need only the standard
      # library.
      - name: Set up Python and Pillow
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Pillow
        run: python3 -m pip install Pillow
      - name: Run the Python scripts' tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      # Every source file, script, workflow, XML resource and CLAUDE.md carries the MPL-2.0 header.
      - name: Check the license headers
        run: python3 .github/scripts/check_license_headers.py
      # A store refuses a listing field past its limit; the pre-commit hook checks every commit the same way.
      - name: Check the store listings' lengths
        run: python3 .github/scripts/check_store_listings.py
      # The release writes every store's listing from these files, so a heading it does not know, a field missing from a
      # language, or a language the app lacks fails here rather than in a release.
      - name: Check the store listings against what the release writes
        run: python3 .github/scripts/store_listings.py --check
      # Android's ICU refuses a regular expression's bare brace the JVM, and so every test, accepts.
      - name: Check the regular expressions' braces
        run: python3 .github/scripts/check_regexes.py
      # Kotlin/Native refuses a comma in a test name the JVM accepts, in the modules whose tests run on the iOS simulator.
      - name: Check the iOS-tested test names
        run: python3 .github/scripts/check_test_names.py
      # A pull request or a push to main pushes no Kotlin file or top-level function past the code-style skill's
      # limits; what was past them already may change. The pre-commit hook judges every commit the same way; this is
      # the backstop. A push is judged against what main was before it, all of its commits together.
      - name: Check the file and function sizes
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          python3 .github/scripts/check_sizes.py --base "$BASE"
      # Every file a pull request or a push changes in :presentation imports only its own package layer and lower ones
      # (presentation/CLAUDE.md); the pre-commit hook judges every commit the same way.
      - name: Check the presentation layers' imports
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          python3 .github/scripts/check_layers.py --base "$BASE"
      # Every file a pull request or a push changes in sync's engine or the remote module's provider core imports nothing
      # of Campfire's library or of Dropbox (data/sync/implementation/CLAUDE.md); the pre-commit hook judges every commit
      # the same way.
      - name: Check the sync engine's and provider core's imports
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          python3 .github/scripts/check_sync_seams.py --base "$BASE"
      # The unqualified tasks run in every module that has them, so a module that gains tests is covered without a
      # change here. --continue reports the failures of every module rather than only the first, and a ktlint violation
      # (spotlessCheck) together with them. The UI tests drive the whole desktop app offscreen from the screenshot tool's
      # module, a plain JVM one with no desktopTest of its own.
      - name: Run the unit tests
        run: bash .github/scripts/gradlew_retrying.sh spotlessCheck desktopTest :tools:screenshots:test --continue
      # Archives far larger than the heap imported under a 128 MiB one, kept out of desktopTest (and so out of the
      # pre-commit hook) for the gigabytes it writes.
      - name: Run the large-archive import test
        run: bash .github/scripts/gradlew_retrying.sh :data:source:local:implementation:largeArchiveImportTest
      # The build logic is a build of its own (gradle/), whose tests the unqualified task above does not reach.
      - name: Run the build logic's tests
        run: bash .github/scripts/gradlew_retrying.sh -p gradle :build-logic:test
      - name: Upload failed unit test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/desktopTest/**
            **/build/test-results/desktopTest/*.xml
            **/build/reports/tests/largeArchiveImportTest/**
            **/build/test-results/largeArchiveImportTest/*.xml
            tools/screenshots/build/reports/tests/test/**
            tools/screenshots/build/test-results/test/*.xml
            gradle/build-logic/build/reports/tests/test/**
          retention-days: 7
      # The web build's storage worker and what keeps the build in the browser are JavaScript, tested by Node rather
      # than by Gradle.
      - name: Run the web build's JavaScript tests
        run: node --test app/web/tests/opfs-writer.test.cjs app/web/tests/offline.test.cjs

  compile:
    name: Compile every platform
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up JDK 21 and Gradle
        uses: ./.github/actions/setup-jdk
      # desktopTest compiles commonMain and desktopMain alone. The Android app compiles every library's androidMain, and
      # the web one their wasmJsMain, into the distribution publish-web.yml ships, which is started below. The desktop
      # app goes through ProGuard as its release does, whose task also has every class it writes verified, since bytecode
      # its optimizer breaks only fails once the class is used.
      - name: Compile the Android, desktop and web apps, the Baseline Profile generator and the screenshot tool
        run: >-
          bash .github/scripts/gradlew_retrying.sh --continue
          :app:android:assembleDebug
          :app:baselineprofile:compileNonMinifiedReleaseKotlin
          :app:desktop:proguardReleaseJars
          :app:desktop:compileWebViewHelper
          :app:web:wasmJsBrowserDistribution
          :tools:screenshots:compileKotlin
      # The web's file storage is the origin private file system, which only a browser has: the contract every
      # platform's storage keeps runs over it in headless Chrome, as it runs on the desktop and the iOS simulator.
      - name: Run the storage tests in headless Chrome
        run: bash .github/scripts/gradlew_retrying.sh :data:source:local:implementation:wasmJsBrowserTest
      # Binaryen's optimizer and the production build's dead code elimination change what runs, and nothing else here
      # loads the site publish-web.yml ships: it is opened in headless Chrome at a few addresses.
      - name: Start the web release build in headless Chrome
        run: node .github/scripts/start_web_release_build.mjs app/web/build/dist/wasmJs/productionExecutable
      # What ProGuard breaks for reflection passes the verification above and fails only once the app runs, which a
      # publishing leg would otherwise be the first to do, after other stores' builds went out. The app image the .deb
      # ships, its class data sharing archive recorded (which needs a display: Xvfb, with Skiko drawing in software), is
      # started as publish-linux.yml starts it, in this job since it packages the ProGuarded jar built above.
      - name: Package the desktop release app image
        run: |
          command -v xvfb-run > /dev/null || { sudo apt-get update && sudo apt-get install --yes xvfb; }
          SKIKO_RENDER_API=SOFTWARE_FAST xvfb-run --auto-servernum bash .github/scripts/gradlew_retrying.sh :app:desktop:recordClassDataArchive
      - name: Start the desktop release build
        run: |
          APP="app/desktop/build/compose/binaries/main-release/app/Campfire/bin/Campfire"
          HOME_DIRECTORY="$RUNNER_TEMP/campfire-home"
          mkdir -p "$HOME_DIRECTORY"
          export JAVA_TOOL_OPTIONS="-Duser.home=$HOME_DIRECTORY -Xlog:class+load=info:file=$RUNNER_TEMP/class-load.txt"
          unset XDG_DATA_HOME
          export SKIKO_RENDER_API=SOFTWARE_FAST
          bash .github/scripts/start_release_build.sh \
            --launcher "$APP" \
            --data "$HOME_DIRECTORY/.local/share/campfire" \
            --log "$RUNNER_TEMP/campfire.log" \
            --class-load "$RUNNER_TEMP/class-load.txt" --min-shared-percent 80 \
            -- xvfb-run --auto-servernum "$APP"

  # R8's full mode removes what a library's keep rules forget, and what it breaks fails only once the shrunk app runs,
  # which nothing else here does, often in a library's own startup initializer, before the first frame. The release
  # build as Play gets it, signed with the committed debug keystore the defaults name, is started on an emulator and
  # walked through its app links.
  android-release:
    name: Start the Android release build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up JDK 21 and Gradle
        uses: ./.github/actions/setup-jdk
      - name: Build the Android release
        run: bash .github/scripts/gradlew_retrying.sh :app:android:assembleRelease
      # The emulator needs hardware acceleration, which a Linux runner has but does not grant its user.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start the release build on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/start_android_release_build.sh app/android/build/outputs/apk/release/android-release.apk

  compile-ios:
    name: Compile the iOS app
    # The runner and the Xcode publish-ios.yml builds the release with, so a retired label or an Xcode that is gone
    # fails here, on every push, rather than in a release.
    runs-on: xcode-27
    env: &compile-ios-env
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps: &compile-ios
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up JDK 21 and Gradle
        uses: ./.github/actions/setup-jdk
      # Every library's iosMain and the framework the Xcode project embeds.
      - name: Compile the iOS framework
        run: bash .github/scripts/gradlew_retrying.sh :app:ios:linkDebugFrameworkIosSimulatorArm64
      # The desktop's web view helper is compiled for the machine Gradle runs on, so each operating system's is compiled
      # on a runner of its own: here macOS's, on Linux in the compile job, and Windows' in test-windows. A runner without
      # the toolchain fails it (CI is set), as the release would.
      - name: Compile the macOS web view helper
        run: bash .github/scripts/gradlew_retrying.sh :app:desktop:compileWebViewHelper
      # The file storage contract (FileStorageContractTest) over the Foundation calls the app makes, on the simulator
      # Kotlin boots by default; only this module's tests run here. A runner without that simulator is answered in the
      # module's build file (testRuns["test"].deviceId), not here. Not in the pre-commit hook: the test link takes minutes.
      - name: Run the storage tests on the iOS simulator
        run: bash .github/scripts/gradlew_retrying.sh :data:source:local:implementation:iosSimulatorArm64Test

  # GitHub cancels a job it finds no hosted runner for within a quarter of an hour, and macOS runners run short often
  # enough that a release lost every store build to it: a compile-ios that never started (cancelled while the run was
  # not) gets one more try, and `passed` counts the second.
  compile-ios-again:
    name: Compile the iOS app, again
    needs: compile-ios
    if: ${{ !cancelled() && needs.compile-ios.result == 'cancelled' }}
    runs-on: xcode-27
    env: *compile-ios-env
    steps: *compile-ios

  test-windows:
    name: Run the unit tests on Windows
    runs-on: windows-latest
    steps:
      # The tree as committed: Git for Windows would turn every line ending into CRLF, which no user's file goes through.
      - name: Keep the line endings as committed
        run: git config --global core.autocrlf false
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up JDK 21 and Gradle
        uses: ./.github/actions/setup-jdk
      # The desktop app ships on the Microsoft Store, and paths, file locks, and atomic replaces behave differently on
      # Windows; the UI tests stay on Linux, since what they draw does not depend on the file system.
      - name: Run the unit tests
        shell: bash
        run: bash .github/scripts/gradlew_retrying.sh desktopTest --continue
      # The web view helper over WebView2, with MSVC and the pinned WebView2 SDK, as the Microsoft Store build makes it.
      - name: Compile the Windows web view helper
        shell: bash
        run: bash .github/scripts/gradlew_retrying.sh :app:desktop:compileWebViewHelper
      - name: Upload failed unit test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-unit-test-reports
          path: |
            **/build/reports/tests/desktopTest/**
            **/build/test-results/desktopTest/*.xml
          retention-days: 7

  # What publish-all.yml asks rather than the workflow's result, which the cancelled compile-ios fails for good even
  # when its second try passed.
  passed:
    name: Every test passed
    needs: [test, compile, android-release, compile-ios, compile-ios-again, test-windows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.passed.outputs.passed }}
    steps:
      - name: Check every job's result
        id: passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq --raw-output '
            (if .["compile-ios-again"].result == "success" then del(.["compile-ios"], .["compile-ios-again"])
             else del(.["compile-ios-again"]) end)
            | to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<< "$RESULTS")
          if [ -n "$failed" ]; then
            echo "::error::Not every test passed: $failed" >&2
            exit 1
          fi
          echo "passed=true" >> "$GITHUB_OUTPUT"
