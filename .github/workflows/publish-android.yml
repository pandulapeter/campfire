# Builds the signed release APK and publishes it to the production track of the Play Console, with the release notes and
# the listing text of documentation/store-listings/google-play in every language, in one edit
# (.github/scripts/play_store_release.py). Nothing is attached to the
# GitHub release: Play is where the Android build is had, and a release only carries what no official channel offers.
# Called by publish-all.yml for every release; dispatched by hand to publish without one, or to repeat the Android half of a
# release that went wrong. With "submit" off - the box of a hand dispatch, or a release whose description says
# <!-- play-store submit: false --> - the release is left as a draft in the Play Console, to be rolled out from there.
# With "listings" off - the box, or <!-- play-store listings: false --> - the listing text is left as it is in the Play
# Console and only the notes are written.

name: 'Publish Android'

on:
  # The same inputs twice, since a called workflow declares its own and knows no "choice".
  workflow_call:
    inputs:
      update_priority:
        type: string
        default: '0'
      release_notes:
        type: string
        required: false
      release_tag:
        type: string
        required: false
      submit:
        type: boolean
        default: true
      release_notes_by_language:
        type: string
        required: false
      listings:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      update_priority:
        description: 'In-app update priority: 0-1 nothing, 2-3 offer it, 4-5 the app is unusable until it is installed'
        type: choice
        options: ['0', '1', '2', '3', '4', '5']
        default: '0'
      release_notes:
        description: 'Release notes override, use \n for line breaks (leave empty to generate them from the commit log)'
        type: string
        required: false
      release_tag:
        description: 'Tag of the release to build (leave empty to build this branch)'
        type: string
        required: false
      submit:
        description: 'Send the release for review (off: leave it as a draft in the Play Console, to change the listing first)'
        type: boolean
        default: true
      listings:
        description: 'Write the listing text of documentation/store-listings in every language (off: write only the release notes)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
      # The tag decides what is built, and the scripts and the shared actions come from the commit this workflow runs
      # from: the tag's on a release, so a re-run of it takes the same ones, and the branch's when it is dispatched by
      # hand with release_tag set, which is how a fix to them reaches a release that is already tagged. A step cannot
      # fetch the action it is written in, so this one is written out in every publish workflow.
      - name: Take the scripts and the actions from the workflow's commit
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          git fetch --depth 1 origin "$WORKFLOW_SHA"
          git checkout FETCH_HEAD -- .github/scripts .github/actions
      - name: Set up JDK 21 and Gradle
        uses: ./.github/actions/setup-jdk
      # A published build with an empty key has no sync provider at all, and nothing downstream would notice: the
      # empty string is the checked-in default, because a fresh clone has to build without a secret.
      - name: Check the sync credentials
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
        run: python3 .github/scripts/require_secrets.py --why "The published app would have no sync provider at all." DROPBOX_APP_KEY
      - name: Read version information
        id: version
        run: |
          VERSION_NAME=$(sed -n 's/^campfire\.versionName=//p' gradle.properties)
          VERSION_CODE=$(sed -n 's/^campfire\.buildNumber=//p' gradle.properties)
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "Could not read campfire.versionName / campfire.buildNumber from gradle.properties" >&2
            exit 1
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Releasing version $VERSION_NAME ($VERSION_CODE)"
      - name: Generate release notes
        env:
          RELEASE_NOTES_OVERRIDE: ${{ inputs.release_notes }}
          # publish-all.yml passes the release's description as it is, and a backslash in prose is a character: %b would
          # rewrite \t and \n and, on \c, stop writing the text altogether - a Play listing quietly cut in half. Only
          # the dispatch form has no way to type a real line break, so only there are escapes expanded.
          EXPAND_ESCAPES: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ -n "$RELEASE_NOTES_OVERRIDE" ]; then
            if [ "$EXPAND_ESCAPES" = 'true' ]; then
              printf '%b\n' "$RELEASE_NOTES_OVERRIDE" > release_notes.txt
            else
              printf '%s\n' "$RELEASE_NOTES_OVERRIDE" > release_notes.txt
            fi
          else
            # Since the release before this one, which is the newest tag that is not on this very commit: that holds
            # for a run on a release's tag and for one on the branch ahead of it alike.
            LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
            if [ -n "$LAST_TAG" ]; then
              RANGE="$LAST_TAG..HEAD"
            else
              RANGE="-n 20"
            fi
            git log $RANGE --pretty=format:'- %s' > release_notes.txt
          fi
          if [ ! -s release_notes.txt ]; then
            printf -- '- Version %s\n' "${{ steps.version.outputs.name }}" > release_notes.txt
          fi
          echo "Generated release notes:"
          cat release_notes.txt
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/android/release.keystore
      # Through local.properties rather than -P: a value on the command line is in the runner's process list for the
      # whole build, and a secret interpolated into the script is re-read by the shell, so a password holding a $, a
      # backtick or a quote would sign the APK with something other than what is in the secret store. The script reads
      # each value from the environment and doubles its backslashes, which java.util.Properties reads as escapes.
      - name: Build release APK
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          python3 .github/scripts/write_local_properties.py \
            campfire.dropbox.appKey=DROPBOX_APP_KEY \
            campfire.android.keyAlias=ANDROID_KEY_ALIAS \
            campfire.android.keyPassword=ANDROID_KEY_PASSWORD \
            campfire.android.keystoreFile=:release.keystore \
            campfire.android.keystorePassword=ANDROID_KEYSTORE_PASSWORD
          ./gradlew :app:android:assembleRelease
      # Uploads the APK and its mapping file, puts it on the production track with the notes in every language (each cut to
      # Play's 500 characters at a line boundary), writes every listing's text, and commits all of it as one edit, so it
      # goes to review as one change (.github/scripts/play_store_release.py).
      - name: Publish to the Play Console
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          RELEASE_NOTES_BY_LANGUAGE: ${{ inputs.release_notes_by_language }}
          SUBMIT: ${{ inputs.submit }}
          LISTINGS: ${{ inputs.listings }}
        run: |
          FLAGS=()
          [ "$SUBMIT" = true ] || FLAGS+=(--draft)
          [ "$LISTINGS" = true ] || FLAGS+=(--no-listings)
          APK=$(find app/android/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No release APK was built." >&2
            exit 1
          fi
          python3 .github/scripts/play_store_release.py com.pandulapeter.campfire "$APK" \
            app/android/build/outputs/mapping/release/mapping.txt \
            "${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})" "${{ inputs.update_priority }}" \
            release_notes.txt "${FLAGS[@]}"
