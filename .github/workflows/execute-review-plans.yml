# A one-time, unattended execution of the review plans: Claude Code follows documentation/issues/EXECUTION.md (one
# worktree per lane, one commit per plan, merged in the README's order), the workflow pushes the result onto master and
# dispatches tests.yml on it (a push made with the workflow's token starts no workflow by itself). A plan that changes
# .github/workflows is left for a normal checkout, since the workflow's token cannot push such a change. Dispatched by
# hand only; delete this file once the plans have landed.

name: 'Execute the review plans'

on:
  workflow_dispatch:
    inputs:
      budget:
        description: 'The most the run may spend on the Anthropic API, in US dollars'
        default: '65'

permissions:
  contents: write
  actions: write

concurrency:
  group: execute-review-plans
  cancel-in-progress: false

jobs:
  execute:
    name: Execute the plans
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      BUDGET: ${{ inputs.budget }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up JDK 21 and Gradle
        uses: ./.github/actions/setup-jdk
      - name: Set up git and the pre-commit hook
        run: |
          git config user.name 'Pandula Péter'
          git config user.email 'pandulapeter@gmail.com'
          git config core.hooksPath .githooks
          echo "START=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code
      - name: Execute the plans
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUMMARY: ${{ runner.temp }}/summary.md
        run: |
          cat > "$RUNNER_TEMP/prompt.md" <<'PROMPT'
          Follow `documentation/issues/EXECUTION.md`.

          You are running unattended in a GitHub Actions job (Ubuntu, 4 cores, 16 GB, no display, no device, no Xcode,
          no Dropbox account). Nobody can answer a question until the run is over: never use AskUserQuestion and never
          wait for an answer. These overrides of EXECUTION.md and the codebase-review skill hold for this run:
          - The user has said to carry out every plan: each open decision (D1 to D5) takes its recommended default.
            Record that in the README's Decisions section within the first plan's commit of lane A.
          - Plan 13 is dropped: `regression-review.yml`, the workflow it changes, has been deleted. `git rm` it with its
            README rows in one commit, `Drop the plan for the deleted review workflow.`, in the main checkout before
            cutting the lanes (then take START from after that commit).
          - Plan 12 changes `.github/workflows/`, which this job's token cannot push: leave it untouched, as a skipped
            plan, for a normal checkout. Never commit anything under `.github/workflows/`.
          - iOS cannot be compiled here: skip `:app:ios:linkDebugFrameworkIosSimulatorArm64` in the full build. The
            workflow runs tests.yml on master afterwards, which compiles iOS. A plan touching an `iosMain` source set or
            `app/ios` beyond a comment is skipped and left for a normal checkout.
          - The hard cap for this whole run is $BUDGET US dollars, subagents included (--max-budget-usd stops the run
            mid-work past it). Merge each lane as soon as it reports, so a run cut short keeps every landed lane.
          - Gradle: at most two builds at once, the main checkout counting as one; after an out-of-memory failure, one at
            a time. The worktrees go next to the checkout as EXECUTION.md says.
          - The pre-commit hook is installed and must pass; never bypass it with --no-verify.
          - Do not push; the workflow pushes master after you finish. The README's merge order, the one-commit-per-plan
            rule, the commit checks, and the finish (deleting the folder when only README.md and EXECUTION.md are
            left) all hold as written; with plan 12 left, the folder stays, the README trimmed to it.

          Finally, write a short Markdown report to the file named by the SUMMARY environment variable: the commits
          landed (short hash and message each), the plans skipped with why, and the final test and build results. Use
          the Oxford comma in every list of three or more.
          PROMPT
          prompt="$(sed "s/\$BUDGET/$BUDGET/g" "$RUNNER_TEMP/prompt.md")"
          claude -p "$prompt" \
            --model claude-opus-5-5 \
            --dangerously-skip-permissions \
            --max-budget-usd "$BUDGET" \
            --output-format stream-json \
            --verbose \
            | tee "$RUNNER_TEMP/execution.jsonl" \
            | jq -r --unbuffered 'select(.type == "assistant") | .message.content[]? | select(.type == "text") | .text' || true
      # The commits, before any push, so nothing is lost if the push is refused.
      - name: Bundle the commits
        if: ${{ always() }}
        run: |
          if [ "$(git rev-list --count "$START..HEAD")" != "0" ]; then
            git branch --force execution HEAD
            git bundle create "$RUNNER_TEMP/execution.bundle" "$START..execution"
          fi
      - name: Keep the transcript, the report, and the commits
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: execution
          path: |
            ${{ runner.temp }}/execution.jsonl
            ${{ runner.temp }}/summary.md
            ${{ runner.temp }}/execution.bundle
          if-no-files-found: ignore
          retention-days: 30
      # Even after a failure or the budget running out: every merged lane is worth keeping. If master moved meanwhile,
      # the commits go to a branch instead, never forced over it.
      - name: Push to master and run the tests
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(git rev-list --count "$START..HEAD")" = "0" ]; then
            echo "The execution committed nothing."
            exit 0
          fi
          if [ -s "$RUNNER_TEMP/summary.md" ]; then
            cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if git push origin HEAD:master; then
            gh workflow run tests.yml --ref master
          else
            branch="review-plans-execution-${{ github.run_id }}"
            git push origin "HEAD:refs/heads/$branch"
            echo "::warning::master moved during the run; the commits are on $branch instead."
            gh workflow run tests.yml --ref "$branch"
          fi
