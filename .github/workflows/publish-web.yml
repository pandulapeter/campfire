# Builds the web distribution and copies it over app/ in the website's repository. Called by publish-all.yml for
# every release; dispatched by hand to publish this branch without one.

name: 'Publish web'

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  WEBSITE_REPOSITORY: pandulapeter/campfire-website
  WEBSITE_BRANCH: main
  WEBSITE_SUBDIRECTORY: app

jobs:
  build:
    name: Build and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      # The tag decides what is built, and the scripts and the shared actions come from the commit this workflow runs
      # from: the tag's on a release, so a re-run of it takes the same ones, and the branch's when it is dispatched by
      # hand with release_tag set, which is how a fix to them reaches a release that is already tagged. A step cannot
      # fetch the action it is written in, so this one is written out in every publish workflow.
      - name: Take the scripts and the actions from the workflow's commit
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          git fetch --depth 1 origin "$WORKFLOW_SHA"
          git checkout FETCH_HEAD -- .github/scripts .github/actions
      - name: Set up JDK 21 and Gradle
        uses: ./.github/actions/setup-jdk
      # A published build with an empty key has no sync provider at all, and nothing downstream would notice: the
      # empty string is the checked-in default, because a fresh clone has to build without a secret.
      - name: Check the sync credentials
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
        run: python3 .github/scripts/require_secrets.py --why "The published app would have no sync provider at all." DROPBOX_APP_KEY
      - name: Read version information
        id: version
        run: |
          VERSION_NAME=$(sed -n 's/^campfire\.versionName=//p' gradle.properties)
          if [ -z "$VERSION_NAME" ]; then
            echo "Could not read campfire.versionName from gradle.properties" >&2
            exit 1
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION_NAME"
      # Through local.properties rather than -P, for the reason publish-android.yml gives: a -P value is in the
      # runner's process list, and a secret interpolated into the script is re-read by the shell.
      - name: Build web distribution
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
        run: |
          python3 .github/scripts/write_local_properties.py campfire.dropbox.appKey=DROPBOX_APP_KEY
          ./gradlew :app:web:wasmJsBrowserDistribution
      - name: Check out the website repository
        uses: actions/checkout@v5
        with:
          repository: ${{ env.WEBSITE_REPOSITORY }}
          ref: ${{ env.WEBSITE_BRANCH }}
          ssh-key: ${{ secrets.CAMPFIRE_WEBSITE_DEPLOY_KEY }}
          path: website
      - name: Copy the distribution into the website
        run: |
          DISTRIBUTION=app/web/build/dist/wasmJs/productionExecutable
          if [ ! -f "$DISTRIBUTION/index.html" ]; then
            echo "The web distribution is missing from $DISTRIBUTION" >&2
            exit 1
          fi
          mkdir -p "website/$WEBSITE_SUBDIRECTORY"
          rsync --archive --delete "$DISTRIBUTION/" "website/$WEBSITE_SUBDIRECTORY/"
          echo "Copied $(find "$DISTRIBUTION" -type f | wc -l | tr -d ' ') files into $WEBSITE_SUBDIRECTORY/"
      - name: Commit and push to the website
        working-directory: website
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all "$WEBSITE_SUBDIRECTORY"
          if git diff --cached --quiet; then
            echo "The published web app is already up to date, nothing to push."
            exit 0
          fi
          git status --short "$WEBSITE_SUBDIRECTORY"
          git commit --message "Update Campfire web app."
          git push origin "$WEBSITE_BRANCH"
