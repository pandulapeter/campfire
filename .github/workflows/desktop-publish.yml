# Builds the installers of the desktop app and attaches them to a GitHub release. jpackage only ever packages for the
# machine it runs on, so there is one runner per operating system and processor.
#
# For Linux this is the whole of how the build is handed out: no store carries it, a Debian package is not something
# anybody signs on its own, and the release page is what Settings links to. The macOS and the Windows installers are a
# stopgap until the two stores have the app, and their names say what they are: "unsigned" is a Gatekeeper refusal
# that has to be overridden in System Settings on the former and a SmartScreen warning on the latter, which is why the
# app links to neither.
#
# Called by release.yml for every release; dispatched by hand to attach the installers to a release that is already
# there.

name: 'Publish Desktop'

on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag of the existing GitHub release to build and attach the installers to'
        type: string
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # An installer that cannot be built is no reason to withhold the others.
      fail-fast: false
      matrix:
        include:
          - name: Linux (amd64)
            runner: ubuntu-latest
            task: packageReleaseDeb
            format: deb
            asset: linux-amd64.deb
          - name: Linux (arm64)
            runner: ubuntu-24.04-arm
            task: packageReleaseDeb
            format: deb
            asset: linux-arm64.deb
          - name: macOS (Apple silicon)
            runner: macos-latest
            task: packageReleaseDmg
            format: dmg
            asset: macos-arm64-unsigned.dmg
          - name: macOS (Intel)
            runner: macos-15-intel
            task: packageReleaseDmg
            format: dmg
            asset: macos-x64-unsigned.dmg
          - name: Windows
            runner: windows-latest
            task: packageReleaseMsi
            format: msi
            asset: windows-x64-unsigned.msi
    defaults:
      run:
        # Git Bash on the Windows runner, so the steps are the same script everywhere.
        shell: bash
    steps:
      # Git for Windows checks text files out with CRLF line endings unless told otherwise, and a gradlew that has
      # them is not a script Bash can run.
      - name: Keep line endings as they are
        run: git config --global core.autocrlf false
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag }}
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
          cache: 'gradle'
      # jpackage builds the .deb with dpkg-deb under fakeroot, and the runner image only promises the former. Xvfb is
      # the display the release build is started on before it is attached, and the GL libraries are what Skiko's
      # native library is linked against - every desktop has them, but the arm64 runner image does not.
      - name: Install packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes fakeroot xvfb libegl1 libgl1
      # The app image is asked for by name: the Compose plugin builds the macOS installer out of it, but on Linux and
      # Windows it hands jpackage the jars and the runtime directly, and the installer is the only thing left on disk.
      # Both tasks are made of the same ProGuard output, so the image is what the installer holds either way.
      - name: Build the installer
        run: |
          ./gradlew :app:desktop:createReleaseDistributable :app:desktop:${{ matrix.task }} \
            -Pcampfire.dropbox.appKey="${{ secrets.DROPBOX_APP_KEY }}"
      # ProGuard breaks an application in ways that only starting it shows - a VerifyError on the first frame is how
      # the last one looked - so the app image is started once before anybody downloads the installer. The demo
      # library appearing in an empty data directory proves that Koin started, the window composed and the library
      # was written; the process still being there a while later proves the first frames did not kill it.
      - name: Start the release build once
        run: |
          BINARIES="app/desktop/build/compose/binaries/main-release/app"
          HOME_DIRECTORY="$RUNNER_TEMP/campfire-home"
          LOG="$RUNNER_TEMP/campfire.log"
          mkdir -p "$HOME_DIRECTORY"
          export JAVA_TOOL_OPTIONS="-Duser.home=$HOME_DIRECTORY"
          LAUNCHER=()
          case "$RUNNER_OS" in
            macOS)
              APP="$BINARIES/Campfire.app/Contents/MacOS/Campfire"
              DATA="$HOME_DIRECTORY/Library/Application Support/Campfire"
              ;;
            Linux)
              APP="$BINARIES/Campfire/bin/Campfire"
              DATA="$HOME_DIRECTORY/.local/share/campfire"
              unset XDG_DATA_HOME
              LAUNCHER=(xvfb-run --auto-servernum)
              # Xvfb has no OpenGL. Skiko would fall back to software rendering on its own, but it logs the failed
              # attempt as a RenderException first, which the check below would take for a crash.
              export SKIKO_RENDER_API=SOFTWARE_FAST
              ;;
            Windows)
              APP="$BINARIES/Campfire/Campfire.exe"
              DATA="$HOME_DIRECTORY/AppData/Roaming/Campfire"
              export JAVA_TOOL_OPTIONS="-Duser.home=$(cygpath -w "$HOME_DIRECTORY")"
              export APPDATA="$(cygpath -w "$HOME_DIRECTORY/AppData/Roaming")"
              ;;
          esac
          "${LAUNCHER[@]}" "$APP" > "$LOG" 2>&1 &
          PID=$!
          # The Windows launcher is not a process Git Bash can signal, and it writes nothing to the log - so there an
          # exception that leaves the process running (Compose Desktop survives one thrown in a LaunchedEffect) goes
          # unseen. The other legs run the same ProGuard output and read the log.
          is_running() {
            if [ "$RUNNER_OS" = Windows ]; then
              tasklist //FI "IMAGENAME eq Campfire.exe" | grep -q Campfire.exe
            else
              kill -0 "$PID" 2> /dev/null
            fi
          }
          stop() {
            if [ "$RUNNER_OS" = Windows ]; then
              taskkill //F //IM Campfire.exe > /dev/null 2>&1 || true
            else
              pkill -f "$APP" || true
              kill "$PID" 2> /dev/null || true
            fi
          }
          fail() {
            echo "::error::$1"
            cat "$LOG"
            stop
            exit 1
          }
          for _ in $(seq 120); do
            is_running || fail "The release build exited on its own before the library was written."
            if [ -f "$DATA/preferences/preferences.json" ] && ls "$DATA/library/songs/"*.cho > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          ls "$DATA/library/songs/"*.cho > /dev/null 2>&1 || fail "The release build did not write the demo library in two minutes."
          sleep 15
          is_running || fail "The release build exited on its own after it had written the library."
          grep -q "Exception" "$LOG" && fail "The release build logged an exception."
          stop
          cat "$LOG"
          echo "The release build started and wrote: $(ls "$DATA/library/songs")"
      - name: Attach the installer to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME=$(sed -n 's/^campfire\.versionName=//p' gradle.properties)
          DIRECTORY="app/desktop/build/compose/binaries/main-release/${{ matrix.format }}"
          INSTALLER=$(find "$DIRECTORY" -name '*.${{ matrix.format }}' | head -n 1)
          if [ -z "$INSTALLER" ]; then
            echo "The installer is missing from $DIRECTORY" >&2
            exit 1
          fi
          ASSET="campfire-$VERSION_NAME-${{ matrix.asset }}"
          cp "$INSTALLER" "$ASSET"
          gh release upload "${{ inputs.release_tag }}" "$ASSET" --clobber
