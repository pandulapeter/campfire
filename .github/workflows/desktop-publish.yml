# Builds the Linux and Windows installers of the desktop app and attaches them to a GitHub release. jpackage only ever
# packages for the machine it runs on, so there is one runner per operating system and processor. The Mac build goes
# to the Mac App Store instead (macos-publish.yml), and nothing for the Mac is attached to a release.
#
# For Linux this is the whole of how the build is handed out: no store carries it, a Debian package is not something
# anybody signs on its own, and the release page is what Settings links to. The Windows installer is a stopgap until
# the Microsoft Store has the app, and its name says what it is: "unsigned" is a SmartScreen warning, which is why the
# app does not link to it.
#
# Every leg tells the build which distribution it is (campfire.desktop.distribution), since the operating system it
# is packaged on cannot tell a store build from the direct download: these are "download" and "linux". The Microsoft
# Store build, once it has a workflow of its own, passes "microsoft-store".
#
# Called by release.yml for every release; dispatched by hand to attach the installers to a release that is already
# there.

name: 'Publish Linux and Windows'

on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag of the existing GitHub release to build and attach the installers to'
        type: string
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # An installer that cannot be built is no reason to withhold the others.
      fail-fast: false
      matrix:
        include:
          # Pinned to the oldest Ubuntu still worth supporting rather than to the newest one available: a .deb asks
          # for the system libraries it was built against, so the runner decides the lowest distribution the package
          # can be installed on. 24.04 completed the 64-bit time_t transition and renamed those libraries, so a
          # package built there asks for libgtk-3-0t64 and friends and is uninstallable on 22.04, Mint 21 and Debian
          # 12 alike. Moving this forward drops every distribution below the new runner's, so it is a decision rather
          # than an upgrade - and GitHub retires a runner image eventually, which is when it has to be made. Building
          # inside a `container: ubuntu:22.04` (or a Debian 12 image) is the alternative that survives the retirement,
          # since it pins the build environment independently of the runner image.
          - name: Linux (amd64)
            runner: ubuntu-22.04
            distribution: linux
            task: packageReleaseDeb
            format: deb
            asset: linux-amd64.deb
          - name: Linux (arm64)
            runner: ubuntu-22.04-arm
            distribution: linux
            task: packageReleaseDeb
            format: deb
            asset: linux-arm64.deb
          - name: Windows
            runner: windows-latest
            distribution: download
            task: packageReleaseMsi
            format: msi
            asset: windows-x64-unsigned.msi
    defaults:
      run:
        # Git Bash on the Windows runner, so the steps are the same script everywhere.
        shell: bash
    steps:
      # Git for Windows checks text files out with CRLF line endings unless told otherwise, and a gradlew that has
      # them is not a script Bash can run.
      - name: Keep line endings as they are
        run: git config --global core.autocrlf false
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag }}
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
          cache: 'gradle'
      # A published build with an empty key has no sync provider at all, and nothing downstream would notice: the
      # empty string is the checked-in default, because a fresh clone has to build without a secret.
      - name: Check the sync credentials
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
        run: |
          if [ -z "$DROPBOX_APP_KEY" ]; then
            echo "::error::DROPBOX_APP_KEY is empty or not visible to this workflow. The published app would have no sync provider at all." >&2
            exit 1
          fi
      # jpackage builds the .deb with dpkg-deb under fakeroot, and the runner image only promises the former. Xvfb is
      # the display the release build is started on before it is attached, and the GL libraries are what Skiko's
      # native library is linked against - every desktop has them, but the arm64 runner image does not.
      - name: Install packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes fakeroot xvfb libegl1 libgl1
      # The app image is asked for by name: the Compose plugin hands jpackage the jars and the runtime directly, and the
      # installer would be the only thing left on disk. Both tasks are made of the same ProGuard output, so the image
      # is what the installer holds.
      # The daemon is stopped afterwards because the Gradle cache is saved when the job ends, and on Windows the lock
      # files a running daemon holds cannot be read into the archive, which fails the save.
      - name: Build the installer
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
        run: |
          printf 'campfire.dropbox.appKey=%s\n' "${DROPBOX_APP_KEY//\\/\\\\}" > local.properties
          ./gradlew :app:desktop:createReleaseDistributable :app:desktop:${{ matrix.task }} \
            -Pcampfire.desktop.distribution=${{ matrix.distribution }}
          ./gradlew --stop
      # ProGuard breaks an application in ways that only starting it shows - a VerifyError on the first frame is how
      # the last one looked - so the app image is started once before anybody downloads the installer. The demo
      # library appearing in an empty data directory proves that Koin started, the window composed and the library
      # was written; the process still being there a while later proves the first frames did not kill it.
      - name: Start the release build once
        run: |
          BINARIES="app/desktop/build/compose/binaries/main-release/app"
          HOME_DIRECTORY="$RUNNER_TEMP/campfire-home"
          LOG="$RUNNER_TEMP/campfire.log"
          mkdir -p "$HOME_DIRECTORY"
          export JAVA_TOOL_OPTIONS="-Duser.home=$HOME_DIRECTORY"
          LAUNCHER=()
          case "$RUNNER_OS" in
            Linux)
              APP="$BINARIES/Campfire/bin/Campfire"
              DATA="$HOME_DIRECTORY/.local/share/campfire"
              unset XDG_DATA_HOME
              LAUNCHER=(xvfb-run --auto-servernum)
              # Xvfb has no OpenGL. Skiko would fall back to software rendering on its own, but it logs the failed
              # attempt as a RenderException first, which the check below would take for a crash.
              export SKIKO_RENDER_API=SOFTWARE_FAST
              ;;
            Windows)
              APP="$BINARIES/Campfire/Campfire.exe"
              DATA="$HOME_DIRECTORY/AppData/Roaming/Campfire"
              export JAVA_TOOL_OPTIONS="-Duser.home=$(cygpath -w "$HOME_DIRECTORY")"
              export APPDATA="$(cygpath -w "$HOME_DIRECTORY/AppData/Roaming")"
              ;;
          esac
          "${LAUNCHER[@]}" "$APP" > "$LOG" 2>&1 &
          PID=$!
          # The Windows launcher is not a process Git Bash can signal, and it writes nothing to the log - so there an
          # exception that leaves the process running (Compose Desktop survives one thrown in a LaunchedEffect) goes
          # unseen. The Linux legs run the same ProGuard output and read the log.
          is_running() {
            if [ "$RUNNER_OS" = Windows ]; then
              tasklist //FI "IMAGENAME eq Campfire.exe" | grep -q Campfire.exe
            else
              kill -0 "$PID" 2> /dev/null
            fi
          }
          stop() {
            if [ "$RUNNER_OS" = Windows ]; then
              taskkill //F //IM Campfire.exe > /dev/null 2>&1 || true
            else
              pkill -f "$APP" || true
              kill "$PID" 2> /dev/null || true
            fi
          }
          fail() {
            echo "::error::$1"
            cat "$LOG"
            stop
            exit 1
          }
          for _ in $(seq 120); do
            is_running || fail "The release build exited on its own before the library was written."
            if [ -f "$DATA/preferences/preferences.json" ] && ls "$DATA/library/songs/"*.cho > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          ls "$DATA/library/songs/"*.cho > /dev/null 2>&1 || fail "The release build did not write the demo library in two minutes."
          sleep 15
          is_running || fail "The release build exited on its own after it had written the library."
          grep -q "Exception" "$LOG" && fail "The release build logged an exception."
          stop
          cat "$LOG"
          echo "The release build started and wrote: $(ls "$DATA/library/songs")"
      - name: Attach the installer to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME=$(sed -n 's/^campfire\.versionName=//p' gradle.properties)
          DIRECTORY="app/desktop/build/compose/binaries/main-release/${{ matrix.format }}"
          INSTALLER=$(find "$DIRECTORY" -name '*.${{ matrix.format }}' | head -n 1)
          if [ -z "$INSTALLER" ]; then
            echo "The installer is missing from $DIRECTORY" >&2
            exit 1
          fi
          ASSET="campfire-$VERSION_NAME-${{ matrix.asset }}"
          cp "$INSTALLER" "$ASSET"
          gh release upload "${{ inputs.release_tag }}" "$ASSET" --clobber
