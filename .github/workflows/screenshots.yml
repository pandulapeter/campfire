# Renders every store image, the website's screenshots and link preview, and the README banners from the checked-out
# code (tools/screenshots, from the library it commits), frames them, checks every store image against its store's
# rules (.github/scripts/store_images.py), and uploads them as one artifact, `screenshots`, kept 90 days:
#
#   store/            the store images as `--frame store` writes them: <store>/<language>/<device>-<n>.png
#   website/          the website repository's own tree: assets/screenshots/**, assets/og-image.jpg
#   readme/           documentation/screenshots/01-06.webp
#   contact-sheets/   a sheet per store row and one of the website, to look at what a run publishes
#
# Called by publish-all.yml when a release's description says <!-- screenshots: true --> (or the app gained a
# language), from the release's tag; the store workflows and the website and README jobs publish the artifact.
# Dispatched by hand to look at what a release would publish, or to make the images a store dispatched by hand takes
# (its screenshots_run input); it publishes nothing either way. It needs no secret: rendering reaches nothing outside
# (tools/screenshots' Fakes.kt), and nothing it builds ships.
#
# The devices whose system chrome is set in Apple's own fonts (SF Pro, which only macOS has: the iPhones, the iPad, and
# the Mac) are rendered on macOS runners, three jobs, no more, since an account runs five macOS jobs at once and the
# tests' iOS job runs beside them during a release; the rest (Android, Windows, and the website's chromeless laptop) on
# Linux runners, of which many run at once. Each job runs two processes of the tool, about 1.6 GB of heap apiece and
# more besides: a hosted macOS runner has 7 GB, a Linux one 16 GB, and a third process ran a Linux one out of memory.
# The framing runs on macOS too, as every image used to be made there.

name: 'Screenshots'

on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true
    outputs:
      ready:
        description: "'true' once the screenshots artifact is uploaded"
        value: ${{ jobs.frame.outputs.ready || jobs.frame-again.outputs.ready }}
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or branch to render (leave empty for this branch)'
        type: string
        required: false

permissions:
  contents: read

# GitHub's default shell for run steps has no pipefail, and a render piped into tee would pass whatever it did.
defaults:
  run:
    shell: bash

jobs:
  # The matrix, written once for the render and for its second try. Each entry carries the title its job is named by,
  # which is how the second try finds the legs that never ran.
  plan:
    name: Plan the render
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.plan.outputs.include }}
    steps:
      - name: Write the matrix
        id: plan
        run: |
          include=$(jq --compact-output 'map(. + {title: "Render \(.name) (\(.shard)/\(.shards))"})' <<'JSON'
          [
            { "name": "Apple", "runner": "macos-latest", "chrome": true, "shard": 0, "shards": 3 },
            { "name": "Apple", "runner": "macos-latest", "chrome": true, "shard": 1, "shards": 3 },
            { "name": "Apple", "runner": "macos-latest", "chrome": true, "shard": 2, "shards": 3 },
            { "name": "Others", "runner": "ubuntu-latest", "chrome": false, "shard": 0, "shards": 4 },
            { "name": "Others", "runner": "ubuntu-latest", "chrome": false, "shard": 1, "shards": 4 },
            { "name": "Others", "runner": "ubuntu-latest", "chrome": false, "shard": 2, "shards": 4 },
            { "name": "Others", "runner": "ubuntu-latest", "chrome": false, "shard": 3, "shards": 4 }
          ]
          JSON
          )
          echo "include=$include" >> "$GITHUB_OUTPUT"

  render:
    name: ${{ matrix.title }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    # A render that hangs would otherwise hold every store job of the release for GitHub's six hours.
    timeout-minutes: 120
    strategy:
      # One failed part fails the run anyway; the others would only spend runners on images nothing frames. A leg that
      # gets no runner is cancelled rather than failed, which stops nothing: it runs again in render-again.
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    steps: &render
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag || inputs.ref || github.ref }}
      - name: Set up JDK 21 and Gradle
        uses: ./.github/actions/setup-jdk
      - name: Build the screenshot tool
        run: bash .github/scripts/gradlew_retrying.sh :tools:screenshots:classes :tools:screenshots:downloadFonts
      # A hosted macOS runner has 7 GB, and the Gradle and Kotlin daemons the build left behind may each hold 4 GB
      # (gradle.properties): with them alive beside the render, the system kills its processes mid-image. So they are
      # stopped, and the run is started by a Gradle of its own with a small heap, which compiles nothing.
      - name: Render
        env:
          ARGUMENTS: --apple-chrome ${{ matrix.chrome }} --shard ${{ matrix.shard }}/${{ matrix.shards }} --parallel 2
        run: |
          ./gradlew --stop
          pkill -f KotlinCompileDaemon || true
          bash .github/scripts/gradlew_retrying.sh --no-daemon -Dorg.gradle.jvmargs=-Xmx768m -Pkotlin.compiler.execution.strategy=in-process \
            :tools:screenshots:run --args="$ARGUMENTS --out $GITHUB_WORKSPACE/renders" 2>&1 \
            | tee "$RUNNER_TEMP/render.log"
          # A broken class fails a shot that the run may still count as written.
          if grep -n 'Exception' "$RUNNER_TEMP/render.log"; then
            echo "::error::The render printed an exception; its images are not to be trusted." >&2
            exit 1
          fi
      - name: Keep the renders
        uses: actions/upload-artifact@v7
        with:
          name: renders-${{ matrix.runner }}-${{ matrix.shard }}
          path: renders
          retention-days: 1

  # GitHub cancels a job it finds no hosted runner for within a quarter of an hour, which macOS runners have made a
  # regular loss: the legs that never started (and only those, and only when no leg failed otherwise) get one more try.
  unacquired:
    name: Find the legs that got no runner
    needs: [plan, render]
    if: ${{ !cancelled() && needs.render.result != 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      include: ${{ steps.find.outputs.include }}
    steps:
      - name: Check out the scripts
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/scripts
      - name: Find them
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN: ${{ needs.plan.outputs.include }}
        run: |
          JOBS="$RUNNER_TEMP/jobs.jsonl"
          gh api --paginate --jq '.jobs[]' \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > "$JOBS"
          python3 -I .github/scripts/unacquired_jobs.py --plan "$PLAN" --jobs "$JOBS" >> "$GITHUB_OUTPUT"

  render-again:
    name: ${{ matrix.title }}, again
    needs: unacquired
    if: ${{ !cancelled() && needs.unacquired.outputs.include != '[]' && needs.unacquired.outputs.include != '' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.unacquired.outputs.include) }}
    steps: *render

  frame:
    name: Frame, check, and upload
    needs: [render, render-again]
    # Every leg rendered, the first time or the second; a leg the second try missed too fails render-again.
    if: ${{ !cancelled() && (needs.render.result == 'success' || needs.render-again.result == 'success') }}
    runs-on: macos-latest
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
    # Framing and checking take a quarter of an hour; the bound is for a runner that hangs, not for a slow one.
    timeout-minutes: 90
    steps: &frame
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag || inputs.ref || github.ref }}
      # As in every publish workflow: the tag decides what is rendered, the scripts come from the workflow's commit.
      - name: Take the scripts and the actions from the workflow's commit
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          git fetch --depth 1 origin "$WORKFLOW_SHA"
          git checkout FETCH_HEAD -- .github/scripts .github/actions
      - name: Set up JDK 21 and Gradle
        uses: ./.github/actions/setup-jdk
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Pillow
        run: python3 -m pip install Pillow
      - name: Download the renders
        uses: actions/download-artifact@v8
        with:
          pattern: renders-*
          merge-multiple: true
          path: renders
      - name: Frame the store images
        run: bash .github/scripts/gradlew_retrying.sh :tools:screenshots:run --args="--frame store --renders $GITHUB_WORKSPACE/renders --out $GITHUB_WORKSPACE/screenshots/store"
      # The banners go into documentation/screenshots of the checkout, the link preview beside the renders.
      - name: Compose the README banners and the link preview
        run: |
          bash .github/scripts/gradlew_retrying.sh :tools:screenshots:run --args="--frame readme --renders $GITHUB_WORKSPACE/renders"
          mkdir -p screenshots/readme
          cp documentation/screenshots/*.webp screenshots/readme/
      - name: Scale the website's screenshots
        run: |
          python3 -I .claude/skills/website-screenshots/scripts/website_screenshots.py renders/Website \
            --link-preview renders/link-preview.png --website screenshots/website
      # Before the upload, so that a store never gets an image it would refuse, nor half of them.
      - name: Check every store image against its store's rules
        run: |
          {
            echo "## Screenshots"
            echo
            python3 .github/scripts/store_images.py --check screenshots/store
            echo
            echo "Website: $(find screenshots/website -type f | wc -l | tr -d ' ') files; README: $(ls screenshots/readme | wc -l | tr -d ' ') banners."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Draw the contact sheets
        run: python3 .github/scripts/contact_sheets.py screenshots/store screenshots/website screenshots/contact-sheets
      - name: Upload the screenshots
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots
          # Long enough to upload the images no API takes by hand, after a release (store_images.py's MANUAL).
          retention-days: 90
      # What publish-all.yml asks rather than the workflow's result, which a leg or a framing that got no runner fails
      # for good even when its second try went through.
      - name: Say the screenshots are ready
        id: ready
        run: echo "ready=true" >> "$GITHUB_OUTPUT"

  # A framing that got no runner, as compile-ios-again in tests.yml: cancelled while the run was not, one more try.
  frame-again:
    name: Frame, check, and upload, again
    needs: frame
    if: ${{ !cancelled() && needs.frame.result == 'cancelled' }}
    runs-on: macos-latest
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
    timeout-minutes: 90
    steps: *frame
