# Builds the Linux packages of the desktop app and attaches them to a GitHub release. jpackage only ever packages for the
# machine it runs on, so there is one runner per processor. This is the whole of how the Linux build is handed out: no
# store carries it, a Debian package is not something anybody signs on its own, and the release page is what the
# website's download section (https://campfire-songbook.com/#download) and the README's "Get Campfire" section link to.
#
# Called by publish-all.yml for every release; dispatched by hand to attach the packages to a release that is already there.

name: 'Publish Linux'

on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag of the existing GitHub release to build and attach the packages to'
        type: string
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # A package that cannot be built is no reason to withhold the other.
      fail-fast: false
      matrix:
        include:
          # Pinned to the oldest Ubuntu still worth supporting rather than to the newest one available: a .deb asks
          # for the system libraries it was built against, so the runner decides the lowest distribution the package
          # can be installed on. 24.04 completed the 64-bit time_t transition and renamed those libraries, so a
          # package built there asks for libgtk-3-0t64 and friends and is uninstallable on 22.04, Mint 21 and Debian
          # 12 alike. Moving this forward drops every distribution below the new runner's, so it is a decision rather
          # than an upgrade - and GitHub retires a runner image eventually, which is when it has to be made. Building
          # inside a `container: ubuntu:22.04` (or a Debian 12 image) is the alternative that survives the retirement,
          # since it pins the build environment independently of the runner image.
          - name: Linux (amd64)
            runner: ubuntu-22.04
            asset: linux-amd64.deb
          - name: Linux (arm64)
            runner: ubuntu-22.04-arm
            asset: linux-arm64.deb
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag }}
      # The tag decides what is built, and the scripts and the shared actions come from the commit this workflow runs
      # from: the tag's on a release, so a re-run of it takes the same ones, and the branch's when it is dispatched by
      # hand with release_tag set, which is how a fix to them reaches a release that is already tagged. A step cannot
      # fetch the action it is written in, so this one is written out in every publish workflow.
      - name: Take the scripts and the actions from the workflow's commit
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          git fetch --depth 1 origin "$WORKFLOW_SHA"
          git checkout FETCH_HEAD -- .github/scripts .github/actions
      - name: Set up JDK 21 and Gradle
        uses: ./.github/actions/setup-jdk
      # A published build with an empty key has no sync provider at all, and nothing downstream would notice: the
      # empty string is the checked-in default, because a fresh clone has to build without a secret.
      - name: Check the sync credentials
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
        run: python3 .github/scripts/require_secrets.py --why "The published app would have no sync provider at all." DROPBOX_APP_KEY
      # jpackage builds the .deb with dpkg-deb under fakeroot, and the runner image only promises the former. Xvfb is
      # the display the release build is started on before it is attached, and the GL libraries are what Skiko's
      # native library is linked against - every desktop has them, but the arm64 runner image does not.
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install --yes fakeroot xvfb libegl1 libgl1
      # The app image is asked for by name: the Compose plugin hands jpackage the jars and the runtime directly, and the
      # package would be the only thing left on disk. Both tasks are made of the same ProGuard output, so the image
      # is what the package holds. The packaging starts the image once to record its class data sharing archive
      # (recordClassDataArchive), which needs a display, and the runner has no GPU to draw it on.
      - name: Build the package
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
        run: |
          python3 .github/scripts/write_local_properties.py campfire.dropbox.appKey=DROPBOX_APP_KEY
          SKIKO_RENDER_API=SOFTWARE_FAST xvfb-run --auto-servernum ./gradlew :app:desktop:createReleaseDistributable :app:desktop:packageReleaseDeb
          ./gradlew --stop
      # ProGuard breaks an application in ways that only starting it shows, so the app image is started once before
      # anybody downloads the package (.github/scripts/start_release_build.sh, which says what it checks). The classes it
      # loads are logged too, for the check of the class data sharing archive the packaging recorded.
      - name: Start the release build once
        run: |
          APP="app/desktop/build/compose/binaries/main-release/app/Campfire/bin/Campfire"
          HOME_DIRECTORY="$RUNNER_TEMP/campfire-home"
          mkdir -p "$HOME_DIRECTORY"
          # A relative name, resolved against the checkout this step runs in.
          export JAVA_TOOL_OPTIONS="-Duser.home=$HOME_DIRECTORY -Xlog:class+load=info:file=class-load.txt"
          unset XDG_DATA_HOME
          # Xvfb has no OpenGL. Skiko would fall back to software rendering on its own, but it logs the failed attempt
          # as a RenderException first, which the check would take for a crash.
          export SKIKO_RENDER_API=SOFTWARE_FAST
          bash .github/scripts/start_release_build.sh \
            --launcher "$APP" \
            --data "$HOME_DIRECTORY/.local/share/campfire" \
            --log "$RUNNER_TEMP/campfire.log" \
            --class-load class-load.txt --min-shared-percent 80 \
            -- xvfb-run --auto-servernum "$APP"
      - name: Attach the package to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME=$(sed -n 's/^campfire\.versionName=//p' gradle.properties)
          DIRECTORY="app/desktop/build/compose/binaries/main-release/deb"
          PACKAGE=$(find "$DIRECTORY" -name '*.deb' | head -n 1)
          if [ -z "$PACKAGE" ]; then
            echo "The package is missing from $DIRECTORY" >&2
            exit 1
          fi
          ASSET="campfire-$VERSION_NAME-${{ matrix.asset }}"
          cp "$PACKAGE" "$ASSET"
          gh release upload "${{ inputs.release_tag }}" "$ASSET" --clobber
