# A one-time, unattended pre-release bug hunt that tests behaviour instead of reading code: Claude Code round-trips
# messy songs through every format the app reads and writes, and loads a library, preferences, and sync state written
# by the last release, on a branch of its own. Each failure found is committed as a test with its fix, or as a test and
# a plan when the fix is not simple. The workflow opens a pull request with the result and dispatches tests.yml on it (a
# pull request opened with the workflow's token starts no workflow by itself). Dispatched by hand only; delete this file
# once the pull request is merged or closed.

name: 'Pre-release bug hunt'

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'The last release''s tag, whose files the upgrade check loads'
        default: '5.2.0'
      budget:
        description: 'The most the run may spend on the Anthropic API, in US dollars'
        default: '35'

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: pre-release-hunt
  cancel-in-progress: false

jobs:
  hunt:
    name: Round-trip the formats and upgrade from the last release
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      BRANCH: hunt/pre-release-${{ github.run_id }}
      RELEASE: ${{ inputs.release }}
      BUDGET: ${{ inputs.budget }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up JDK 21 and Gradle
        uses: ./.github/actions/setup-jdk
      - name: Set up the branch and the pre-commit hook
        run: |
          git config user.name 'Pandula Péter'
          git config user.email 'pandulapeter@gmail.com'
          git config core.hooksPath .githooks
          git checkout -b "$BRANCH"
          echo "START=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code
      - name: Hunt
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_BODY: ${{ runner.temp }}/pr-body.md
        run: |
          cat > "$RUNNER_TEMP/prompt.md" <<'PROMPT'
          You are running unattended in a GitHub Actions job (Ubuntu, 4 cores, 16 GB, no display, no device, no Xcode).
          Nobody can answer a question until the run is over: never use AskUserQuestion and never wait for an answer.

          Task: a pre-release bug hunt on Campfire that TESTS BEHAVIOUR rather than reading code. Fifty review sweeps
          have read this code against its CLAUDE.md files; do not do another. Find what reading misses by running the
          code on inputs nobody imagined, and leave every finding behind as a test. What ships next is
          `git log $RELEASE..HEAD`: right-to-left songs (Hebrew, Arabic) in the editor, the layout, the PDF and its
          re-import, Campfire's own PDF imported back, and chord degrees off by default with a song that names no key
          numbered in Nashville and Roman notation from the key its chords suggest. Weigh the hunt toward those.

          Part 1, round trips. Build a corpus of messy, realistic songs as test resources (a few dozen, each small):
          ChordPro with every directive family the app knows, chords mid-word and at line ends, tabs, grids, `abc`
          blocks, `<b>`/`<i>`/`<u>` markup, comments, `{define}`s, capo and transpose lines, German/Latin input
          notation, songs with no key, Hebrew and Arabic lyrics with and without vowel points, mixed-direction lines
          (Latin words, numbers, and chords inside Hebrew), plain-text chord sheets as pasted from websites, and
          ABC tunes. Then assert, for each song, that nothing is lost or changed along every round trip the code
          offers, for example:
          - parse → serialize → parse is stable (and serialize is idempotent);
          - transpose up n then down n gives back the song; a capo added keeps every sounding name;
          - plain text → ChordPro → plain text keeps every chord over the same syllable;
          - the PDF export (`presentation`'s `ui/print`, rendered in desktopTest as `PrintRendererTest` does) imported
            back through the PDF converter (`data/formats`, `chordpro/convert`) keeps the title, the sections, every
            lyric in reading order, and every chord over the same syllable, in both reading directions;
          - the key guessed for a song that names none is a key its chords plausibly belong to, never crashes on a song
            with no chords, odd chords, or only slash chords, and does not change when the song is transposed except
            by the same interval.
          Prefer property-style tests over the corpus (and generated variations of it) to one-off examples. Where the
          round trip is lossy by design (a documented rule in a CLAUDE.md or KDoc), assert the documented outcome, not
          an identity, and do not report it.

          Part 2, the upgrade from the last release. In a git worktree of `$RELEASE` (outside the checkout, e.g.
          `../release`), write a small throwaway test there that uses THAT version's own code to write, into a
          directory, a realistic library: songs, setlists (archived, dated, with per-setlist transpositions and tempo
          overrides), `preferences.json` with every preference set away from its default, the sync index, the shared
          links mirror and journal, and the editor draft. Copy those files into HEAD's test resources as fixtures (they
          stay committed as the permanent upgrade check), then at HEAD assert that loading them loses nothing, resets
          nothing the user set (a default changed since `$RELEASE`, such as chord degrees, applies only where the user
          never chose), does not leave the `.bad` file behind, and that a sync run planned from that index and an
          unchanged remote changes nothing on either side. Discard the worktree afterwards; never commit in it.

          Rules for an unattended run:
          - There is no memory directory here; skip memory reads and writes. Read the root CLAUDE.md and the CLAUDE.md
            of each module you test before writing tests there.
          - A failing test is a finding only once you have confirmed the behaviour is wrong for a user (not the test).
            Each confirmed finding: if the fix is simple and local, commit the test and the fix together, one commit
            each; otherwise commit the test with the fix as a plan in `documentation/issues/` (one file per plan, in
            the codebase-review skill's plan format, with a README.md index), never an ignored or disabled test: leave
            such a test out of the commit and put it in the plan instead. Commit the corpus and the passing tests too:
            they are the lasting value of the run.
          - Commit as you go (every verified fix and every finished group of tests at once), so a run cut short by the
            budget or the time limit still leaves its work.
          - Hard cap: $BUDGET US dollars for this whole run, subagents included (enforced by --max-budget-usd; past it
            the run stops mid-work). Do most of the work yourself; use at most two subagents, for building the corpus
            or for the upgrade fixtures, on the most capable model.
          - You run in print mode: ending your turn ends the run and kills every subagent still working. Launch every
            Agent call in the foreground, never with `run_in_background`. Never end your turn before your work is
            committed and the description written.
          - You are already on the branch this run made; commit on it. Never create, switch, or push a branch, and never
            open a pull request: the workflow pushes and opens it after you finish. The workflow's token cannot push a
            change under `.github/workflows/`: never commit one.
          - Gradle: one build at a time on this runner (the `$RELEASE` worktree counts). Run only the touched modules'
            tests (`:<module>:desktopTest --tests ...`) while iterating, and every touched module's full desktopTest
            before each commit. iOS cannot be compiled here: a fix touching an `iosMain` source set or `app/ios` is a
            plan. The workflow runs tests.yml (every test and every platform, iOS included) on the branch afterwards.
          - The pre-commit hook is installed and must pass (license headers, file sizes, spotlessCheck); never bypass it
            with --no-verify. Keep test resources small; the size limits apply to them.
          - Load the `code-style` skill before the first edit and the `commit-messages` skill before the first commit,
            and follow them.

          Finally, write the pull request's description to the file named by the PR_BODY environment variable, in
          Markdown: a first line saying what the hunt was, what was tested (the corpus, the round trips, the upgrade
          fixtures), the bugs found with their fix commits (short hash and message each), the plans with their
          severity, and what was found lossy by design. Use the Oxford comma in every list of three or more. Keep it
          under a screen and a half.
          PROMPT
          prompt="$(sed "s/\$RELEASE/$RELEASE/g; s/\$BUDGET/$BUDGET/g" "$RUNNER_TEMP/prompt.md")"
          claude -p "$prompt" \
            --model claude-opus-5-5 \
            --dangerously-skip-permissions \
            --max-budget-usd "$BUDGET" \
            --output-format stream-json \
            --verbose \
            | tee "$RUNNER_TEMP/hunt.jsonl" \
            | jq -r --unbuffered 'select(.type == "assistant") | .message.content[]? | select(.type == "text") | .text' || true
      - name: Keep the run's transcript
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: hunt-transcript
          path: ${{ runner.temp }}/hunt.jsonl
          retention-days: 30
      # Even after a failure or the budget running out: whatever was committed is worth a look.
      - name: Push the branch and open the pull request
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(git rev-list --count "$START..HEAD")" = "0" ]; then
            echo "The hunt committed nothing."
            exit 0
          fi
          git push origin "$BRANCH"
          body="$RUNNER_TEMP/pr-body.md"
          if [ ! -s "$body" ]; then
            {
              echo "The pre-release bug hunt (round trips, and the upgrade from $RELEASE) ended before writing its summary (see the run's transcript artifact)."
              echo
              git log --format='- %h %s' "$START..HEAD"
            } > "$body"
          fi
          gh pr create --base master --head "$BRANCH" --title 'Pre-release bug hunt: format round trips and the upgrade from the last release' --body-file "$body"
          gh workflow run tests.yml --ref "$BRANCH"
