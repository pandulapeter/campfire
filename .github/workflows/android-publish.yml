# Builds the signed release APK and uploads it to the production track of the Play Console. Nothing is attached to the
# GitHub release: Play is where the Android build is had, and a release only carries what no official channel offers.
# Called by release.yml for every release; dispatched by hand to publish without one, or to repeat the Android half of
# a release that went wrong.

name: 'Publish Android'

on:
  # The same inputs twice, since a called workflow declares its own and knows no "choice".
  workflow_call:
    inputs:
      update_priority:
        type: string
        default: '0'
      release_notes:
        type: string
        required: false
      release_tag:
        type: string
        required: false
  workflow_dispatch:
    inputs:
      update_priority:
        description: 'In-app update priority: 0-1 nothing, 2-3 offer it, 4-5 the app is unusable until it is installed'
        type: choice
        options: ['0', '1', '2', '3', '4', '5']
        default: '0'
      release_notes:
        description: 'Release notes override, use \n for line breaks (leave empty to generate them from the commit log)'
        type: string
        required: false
      release_tag:
        description: 'Tag of the release to build (leave empty to build this branch)'
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
          cache: 'gradle'
      # A published build with an empty key has no sync provider at all, and nothing downstream would notice: the
      # empty string is the checked-in default, because a fresh clone has to build without a secret.
      - name: Check the sync credentials
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
        run: |
          if [ -z "$DROPBOX_APP_KEY" ]; then
            echo "::error::DROPBOX_APP_KEY is empty or not visible to this workflow. The published app would have no sync provider at all." >&2
            exit 1
          fi
      - name: Read version information
        id: version
        run: |
          VERSION_NAME=$(sed -n 's/^campfire\.versionName=//p' gradle.properties)
          VERSION_CODE=$(sed -n 's/^campfire\.android\.versionCode=//p' gradle.properties)
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "Could not read campfire.versionName / campfire.android.versionCode from gradle.properties" >&2
            exit 1
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Releasing version $VERSION_NAME ($VERSION_CODE)"
      - name: Generate release notes
        env:
          RELEASE_NOTES_OVERRIDE: ${{ inputs.release_notes }}
          # release.yml passes the release's description as it is, and a backslash in prose is a character: %b would
          # rewrite \t and \n and, on \c, stop writing the text altogether - a Play listing quietly cut in half. Only
          # the dispatch form has no way to type a real line break, so only there are escapes expanded.
          EXPAND_ESCAPES: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          mkdir -p whatsnew
          if [ -n "$RELEASE_NOTES_OVERRIDE" ]; then
            if [ "$EXPAND_ESCAPES" = 'true' ]; then
              printf '%b\n' "$RELEASE_NOTES_OVERRIDE" > release_notes.txt
            else
              printf '%s\n' "$RELEASE_NOTES_OVERRIDE" > release_notes.txt
            fi
          else
            # Since the release before this one, which is the newest tag that is not on this very commit: that holds
            # for a run on a release's tag and for one on the branch ahead of it alike.
            LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
            if [ -n "$LAST_TAG" ]; then
              RANGE="$LAST_TAG..HEAD"
            else
              RANGE="-n 20"
            fi
            git log $RANGE --pretty=format:'- %s' > release_notes.txt
          fi
          if [ ! -s release_notes.txt ]; then
            printf -- '- Version %s\n' "${{ steps.version.outputs.name }}" > release_notes.txt
          fi
          # The Play Store rejects the whole release when the notes are over its 500 character limit, so they are cut
          # at a line boundary rather than mid-sentence. Characters, not bytes: awk on the runner is mawk, whose
          # length() counts bytes, and would cut a text with accented letters short of what fits.
          python3 - release_notes.txt whatsnew/whatsnew-en-US <<'PYTHON'
          import sys

          LIMIT = 500
          lines = open(sys.argv[1], encoding="utf-8").read().splitlines()
          kept, total = [], 0
          for line in lines:
              total += len(line) + 1
              if total > LIMIT:
                  break
              kept.append(line)
          if not kept and lines:
              # A first line over the limit on its own, which a paragraph of the visible description can be, is cut at
              # the last word that fits rather than leaving the listing with nothing to say.
              first = lines[0][:LIMIT - 1]
              kept = [first.rsplit(" ", 1)[0] if " " in first else first]
          if len(kept) < len(lines):
              print(f"::warning::{sys.argv[2]} was cut to {LIMIT} characters.")
          with open(sys.argv[2], "w", encoding="utf-8") as output:
              output.write("\n".join(kept) + "\n")
          PYTHON
          echo "Generated release notes:"
          cat whatsnew/whatsnew-en-US
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/android/release.keystore
      # Through local.properties rather than -P: a value on the command line is in the runner's process list for the
      # whole build, and a secret interpolated into the script is re-read by the shell, so a password holding a $, a
      # backtick or a quote would sign the APK with something other than what is in the secret store. Backslashes are
      # doubled because java.util.Properties treats one as an escape inside a value.
      - name: Build release APK
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          escape() { printf '%s' "${1//\\/\\\\}"; }
          {
            printf 'campfire.dropbox.appKey=%s\n' "$(escape "$DROPBOX_APP_KEY")"
            printf 'campfire.android.keyAlias=%s\n' "$(escape "$ANDROID_KEY_ALIAS")"
            printf 'campfire.android.keyPassword=%s\n' "$(escape "$ANDROID_KEY_PASSWORD")"
            printf 'campfire.android.keystoreFile=release.keystore\n'
            printf 'campfire.android.keystorePassword=%s\n' "$(escape "$ANDROID_KEYSTORE_PASSWORD")"
          } > local.properties
          ./gradlew :app:android:assembleRelease
      - name: Upload the APK to the Play Console
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.pandulapeter.campfire
          releaseFiles: app/android/build/outputs/apk/release/*.apk
          mappingFile: app/android/build/outputs/mapping/release/mapping.txt
          releaseName: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
          tracks: production
          status: completed
          # What the in-app update gate in :presentation reads; see the Updates section of CLAUDE.md for the
          # thresholds. Left at 0 a release is simply one Play installs on its own schedule, and the app says nothing.
          inAppUpdatePriority: ${{ inputs.update_priority }}
          changesNotSentForReview: false
          whatsNewDirectory: whatsnew
