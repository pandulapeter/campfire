[versions]
android-compileSdk = "37" # https://developer.android.com/tools/releases/platforms
android-minSdk = "28"
androidx-activity = "1.13.0" # https://developer.android.com/jetpack/androidx/releases/activity
androidx-benchmark = "1.5.0" # https://developer.android.com/jetpack/androidx/releases/benchmark
androidx-browser = "1.10.0" # https://developer.android.com/jetpack/androidx/releases/browser
androidx-lifecycle = "2.11.0" # https://github.com/JetBrains/compose-multiplatform-core/releases (org.jetbrains.androidx.lifecycle)
androidx-navigation3 = "1.1.2" # https://github.com/JetBrains/compose-multiplatform-core/releases (org.jetbrains.androidx.navigation3)
androidx-profileinstaller = "1.4.1" # https://developer.android.com/jetpack/androidx/releases/profileinstaller
androidx-test-junit = "1.3.0" # https://developer.android.com/jetpack/androidx/releases/test
androidx-test-uiautomator = "2.4.0" # https://developer.android.com/jetpack/androidx/releases/test-uiautomator
coil = "3.6.3" # https://github.com/coil-kt/coil/releases
compose-reorderable = "3.1.0" # https://github.com/Calvin-LL/Reorderable/releases
google-playAppUpdate = "2.1.0" # https://developer.android.com/guide/playcore/in-app-updates
gradle = "9.4.1" # https://developer.android.com/studio/releases/gradle-plugin
hyperether-localization = "2.0.1" # https://github.com/hyperether/compose-multiplatform-localize/releases
jbr-api = "1.10.1" # https://github.com/JetBrains/JetBrainsRuntimeApi/releases
jetbrains-compose = "1.12.1" # https://github.com/JetBrains/compose-jb/releases
jetbrains-compose-material3 = "1.12.0-alpha03" # https://github.com/JetBrains/compose-multiplatform-core/releases (org.jetbrains.compose.material3)
jvmTarget = "21" # https://kotlinlang.org/docs/gradle.html
koin = "4.2.2" # https://github.com/InsertKoinIO/koin/tags
koin-compilerPlugin = "1.2.1" # https://github.com/InsertKoinIO/koin-compiler-plugin/releases
kotlin = "2.4.20" # https://kotlinlang.org/docs/releases.html#release-details
kotlin-browser = "0.5.0" # https://github.com/Kotlin/kotlinx-browser/releases
kotlin-coroutines = "1.11.0" # https://github.com/Kotlin/kotlinx.coroutines/releases
kotlin-datetime = "0.8.0" # https://github.com/Kotlin/kotlinx-datetime/releases
kotlin-serialization = "1.11.0" # https://github.com/Kotlin/kotlinx.serialization/releases
ktlint = "1.8.0" # https://github.com/pinterest/ktlint/releases
ktor = "3.6.0" # https://github.com/ktorio/ktor/releases
skiko = "0.150.1" # Must equal the skiko version Compose brings in: ./gradlew :app:desktop:dependencies --configuration runtimeClasspath | grep skiko
spotless = "8.10.2" # https://github.com/diffplug/spotless/blob/main/plugin-gradle/CHANGES.md

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "androidx-benchmark" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "androidx-browser" }
androidx-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "androidx-navigation3" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "androidx-profileinstaller" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "androidx-test-uiautomator" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
compose-animation = { module = "org.jetbrains.compose.animation:animation", version.ref = "jetbrains-compose" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "jetbrains-compose" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "jetbrains-compose" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "jetbrains-compose-material3" }
compose-reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "compose-reorderable" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "jetbrains-compose" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "jetbrains-compose" }
compose-ui-backhandler = { module = "org.jetbrains.compose.ui:ui-backhandler", version.ref = "jetbrains-compose" }
google-playAppUpdate = { module = "com.google.android.play:app-update", version.ref = "google-playAppUpdate" }
gradle = { module = "com.android.tools.build:gradle", version.ref = "gradle" }
jbr-api = { module = "org.jetbrains.runtime:jbr-api", version.ref = "jbr-api" }
# Versioned by the JUnit BOM that kotlin-test brings in; Gradle no longer puts the launcher on the test runtime itself.
junit-platformLauncher = { module = "org.junit.platform:junit-platform-launcher" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-annotations = { module = "io.insert-koin:koin-annotations", version.ref = "koin" }
koin-compilerPlugin = { module = "io.insert-koin:koin-compiler-gradle-plugin", version.ref = "koin-compilerPlugin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-core-viewmodel = { module = "io.insert-koin:koin-core-viewmodel", version.ref = "koin" }
kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-composeCompiler = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
kotlin-browser = { module = "org.jetbrains.kotlinx:kotlinx-browser", version.ref = "kotlin-browser" }
kotlin-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlin-coroutines" }
kotlin-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlin-coroutines" }
kotlin-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlin-coroutines" }
kotlin-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlin-datetime" }
kotlin-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlin-serialization" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-js = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
skiko-angle-windows-x64 = { module = "org.jetbrains.skiko:skiko-awt-runtime-angle-windows-x64", version.ref = "skiko" }
spotless-gradlePlugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }

[plugins]
android-application = { id = "com.android.application", version.ref = "gradle" }
android-multiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "gradle" }
android-test = { id = "com.android.test", version.ref = "gradle" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "androidx-benchmark" }
compose = { id = "org.jetbrains.compose", version.ref = "jetbrains-compose" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hyperether-localization = { id = "com.hyperether.localization", version.ref = "hyperether-localization" }
koin-compiler = { id = "io.insert-koin.compiler.plugin", version.ref = "koin-compilerPlugin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
