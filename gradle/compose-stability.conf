// The classes the Compose compiler is told are stable although it cannot see so for itself. :chordpro is not compiled
// with the Compose compiler, so its model carries no stability information, and every parameter typed with it would
// be compared by instance: a new parse would recompose every line of a song, the ones that did not change included.
// Every class here is immutable - data classes and objects of vals, whose collections are never mutated once the model
// is built - and that is a promise the model has to keep (see chordpro/CLAUDE.md). Each class is named on its own
// rather than by a wildcard over the package, so that a class added to it later is not vouched for unread.
